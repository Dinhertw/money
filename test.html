<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳務管理系統</title>

  <link rel="icon" type="image/png" href="https://dinhertw.github.io/money/icon.png">
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Lucide Icons 套件 -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SweetAlert2 彈出視窗套件 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* 🎨 深色模式 (Dark Mode) */
    [data-bs-theme="dark"] {
      --app-bg: #121212;
      --card-bg: #1e1e1e;
      --card-border: #2d2d2d;
      --input-bg: #262626;
      --text-primary: #f1f5f9;
      --text-secondary: #a1a1aa;
      --hero-bg: linear-gradient(135deg, #1f242d 0%, #161a22 100%);
      --hero-title: #ffffff;
      --date-picker-filter: invert(0.8);
      --accordion-btn-bg: #1e1e1e;
      --accordion-btn-active-bg: #2a2a2a;
      --table-hover-bg: #262626;
      --th-hover-bg: 0;
      --modal-bg: #1e1e1e;
    }
    
    /* ☀️ 淺色模式 (Light Mode) */
    [data-bs-theme="light"] {
      --app-bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --input-bg: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --hero-bg: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      --hero-title: #1e3a8a;
      --date-picker-filter: none;
      --accordion-btn-bg: #ffffff;
      --accordion-btn-active-bg: #f1f5f9;
      --table-hover-bg: #f8fafc;
      --th-hover-bg: 0;
      --modal-bg: #ffffff;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
    }
    
    body {
      background-color: var(--app-bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
      transition: background-color 0.2s, color 0.2s;
      padding-top: 1.5rem !important;
      padding-bottom: 1.5rem !important;
    }
    
    .slate-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
    }
    
    .hero-card {
      background: var(--hero-bg);
      border: 1px solid var(--card-border);
    }
    
    .hero-card .hero-amount {
      color: var(--hero-title);
    }
    
    .form-label, label, small, .small, .text-sub {
      color: var(--text-secondary) !important;
      font-weight: 500;
    }
    
    .form-control, .form-select, .btn-custom-dropdown {
      background-color: var(--input-bg) !important;
      border: 1px solid var(--card-border) !important;
      color: var(--text-primary) !important;
    }
    
    .form-control:focus, .form-select:focus, .btn-custom-dropdown:focus{
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
    }
    
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: var(--date-picker-filter);
      cursor: pointer;
    }
    
    .btn-slate-primary {
      background-color: #2563eb;
      border: none;
      color: #ffffff;
      font-weight: 600;
    }
    
    .btn-slate-primary:hover {
      background-color: #1d4ed8;
      color: #ffffff;
    }
    
    .dropdown-menu, .modal-content {
      background-color: var(--card-bg) !important;
      border: 1px solid var(--card-border) !important;
      color: var(--text-primary) !important;
    }
    
    .dropdown-menu {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4) !important;
    }
    
    .dropdown-item { color: var(--text-primary) !important; }
    .dropdown-item:hover { background-color: var(--input-bg) !important; }
    
    .accordion-item {
      background-color: transparent !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 12px !important;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    
    .accordion-button {
      background-color: var(--accordion-btn-bg) !important;
      color: var(--text-primary) !important;
      box-shadow: none !important;
      padding: 1rem 1.25rem;
    }
    
    .accordion-button:not(.collapsed) {
      background-color: var(--accordion-btn-active-bg) !important;
    }
    
    .accordion-body {
      background-color: var(--card-bg) !important;
      padding: 0;
    }
    
    .table-custom {
      margin-bottom: 0;
      color: var(--text-primary) !important;
    }
    
    .table-custom th {
      background-color: var(--input-bg);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      user-select: none;
    }
    
    .table-custom th.sortable {
      cursor: pointer;
      transition: background-color 0.15s ease-in-out, color 0.15s ease-in-out;
    }
    
    .table-custom th.sortable:hover {
      background-color: var(--th-hover-bg);
      color: var(--text-primary);
    }
    
    .table-custom th.sortable.active {
      color: #60a5fa;
    }
    
    .table-custom td {
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 1rem;
      vertical-align: middle;
      font-size: 0.95rem;
    }
    
    .table-custom tr:last-child td {
      border-bottom: none;
    }
    
    .table-custom tbody tr:hover {
      background-color: var(--table-hover-bg);
    }

    /* 🖥️ 強制 SweetAlert2 滿版且零邊距 */
    .swal2-container {
      padding: 0 !important;
    }

    .swal2-container .swal-fullscreen-popup {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
    }

    /* Lucide 尺寸對齊微調 */
    i[data-lucide] {
      width: 1.25rem;
      height: 1.25rem;
      display: inline-block;
      vertical-align: -0.2em;
    }
    
    @media (min-width: 992px) {
      .history-container {
        max-height: 580px;
        overflow-y: auto;
        padding: 3px;
      }
    }
    
    @media (max-width: 991.98px) {
      .history-container {
        max-height: none !important;
        overflow-y: visible !important;
      }
    }

    .admin-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="container flex-grow-1" style="max-width: 1000px;">
    
    <!-- 頁頭頂部控制列：顯示管理模式與設定按鈕 -->
    <div class="d-flex align-items-center justify-content-between mb-3 px-1">
      <div class="d-flex align-items-center gap-2">
        <h4 class="fw-bold m-0" id="appHeaderTitle">帳務管理系統</h4>
        <span id="adminStatusBadge" class="badge bg-secondary-subtle text-secondary admin-badge">一般檢視</span>
      </div>
      
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-custom-dropdown rounded-3 d-flex align-items-center gap-1.5" id="adminAuthBtn" onclick="toggleAdminAuth()">
          <i data-lucide="lock" class="text-primary"></i> <span id="adminAuthBtnText">管理員驗證</span>
        </button>
        <button class="btn btn-sm btn-custom-dropdown rounded-3 d-flex align-items-center gap-1.5 d-none" id="settingsBtn" onclick="openSettingsModal()">
          <i data-lucide="settings" class="text-primary"></i> <span>系統設定</span>
        </button>
      </div>
    </div>

    <div id="announcementContainer" class="d-flex flex-column gap-2 mb-4"></div>

    <div class="row g-4">
      <div class="col-12 col-lg-5">
        <div class="d-flex flex-column gap-3 sticky-lg-top" style="top: 1.5rem; z-index: 10;">
          <div class="card slate-card hero-card p-3">
            <div class="card-body">
              <div class="d-flex align-items-center gap-2 mb-2">
                <i data-lucide="wallet" class="text-primary"></i>
                <span class="text-sub">目前待還總金額</span>
              </div>
              <h2 class="display-6 fw-bold mb-0 hero-amount" id="totalOwed">NT$ --</h2>
            </div>
          </div>

          <div class="card slate-card">
            <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
              <h5 class="card-title fw-bold m-0 d-flex align-items-center gap-2">
                <i data-lucide="file-pen-line" class="text-primary"></i> 新增紀錄
              </h5>
            </div>
            <div class="card-body p-4">
              <form id="ledgerForm">
                <div class="row g-3">
                  <div class="col-6">
                    <label for="date" class="form-label small">日期</label>
                    <input type="date" class="form-control rounded-3" id="date" required>
                  </div>

                  <div class="col-6">
                    <label class="form-label small">類型</label>
                    <input type="hidden" id="type" value="借錢">
                    <div class="dropdown">
                      <button class="btn btn-custom-dropdown dropdown-toggle w-100 rounded-3 text-start d-flex align-items-center justify-content-between" type="button" id="typeDropdownBtn" data-bs-toggle="dropdown">
                        <span id="typeDropdownLabel"><i data-lucide="arrow-up-right" class="text-danger me-1"></i> 借錢</span>
                      </button>
                      <ul class="dropdown-menu dropdown-menu-end w-100 rounded-3">
                        <li>
                          <a class="dropdown-item py-2" href="#" onclick="selectType('借錢', '<i data-lucide=\'arrow-up-right\' class=\'text-danger me-1\'></i> 借錢'); return false;">
                            <i data-lucide="arrow-up-right" class="text-danger me-1"></i> 借錢
                          </a>
                        </li>
                        <li>
                          <a class="dropdown-item py-2" href="#" onclick="selectType('還錢', '<i data-lucide=\'arrow-down-left\' class=\'text-success me-1\'></i> 還錢'); return false;">
                            <i data-lucide="arrow-down-left" class="text-success me-1"></i> 還錢
                          </a>
                        </li>
                      </ul>
                    </div>
                  </div>

                  <div class="col-12">
                    <label for="amount" class="form-label small">金額 (NT$)</label>
                    <input type="number" class="form-control rounded-3" id="amount" min="1" required placeholder="例如：100">
                  </div>
                  <div class="col-12">
                    <label for="note" class="form-label small">備註說明</label>
                    <input type="text" class="form-control rounded-3" id="note" placeholder="例如：午餐、飲料、轉帳">
                  </div>
                  <div class="col-12 pt-2">
                    <button type="submit" class="btn btn-slate-primary w-100 py-2.5 rounded-3 d-flex align-items-center justify-content-center gap-2" id="submitBtn">
                      <i data-lucide="send"></i> 送出紀錄
                    </button>
                    <!-- 按鈕正下方的提示訊息 -->
                    <div id="submitAlert" class="alert alert-success mt-2 mb-0 py-2 px-3 text-center rounded-3 d-none fade" role="alert" style="font-size: 0.9rem;">
                      <i data-lucide="check-circle" class="me-1"></i> 已記錄！
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-7">
        <div class="card slate-card">
          <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0 d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
              <h5 class="card-title fw-bold m-0 d-flex align-items-center gap-2">
                <i data-lucide="history" class="text-primary"></i> 歷史紀錄
              </h5>
              <span class="badge bg-secondary-subtle text-secondary rounded-pill px-2.5 py-1 fw-normal small" id="recordCount">0 筆</span>
            </div>

            <button class="btn btn-sm btn-custom-dropdown rounded-pill px-3 py-1 d-flex align-items-center gap-1.5" onclick="toggleSortOrder()" id="sortBtn">
              <i data-lucide="arrow-down-wide-narrow" class="text-primary"></i> <span id="sortLabel">最新月在前</span>
            </button>
          </div>

          <div class="card-body p-4">
            <div class="history-container">
              <div class="accordion" id="monthlyHistoryAccordion">
                <div class="text-center text-sub py-5">載入中...</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 📝 紀錄編輯 Modal -->
  <div class="modal fade" id="editRecordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content slate-card rounded-4 shadow-lg border-0">
        <div class="modal-header border-bottom border-secondary-subtle p-4">
          <h5 class="modal-title fw-bold d-flex align-items-center gap-2">
            <i data-lucide="edit-3" class="text-primary"></i> 編輯紀錄
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="editRecordForm">
            <input type="hidden" id="editIndex">
            <div class="row g-3">
              <div class="col-6">
                <label for="editDate" class="form-label small">日期</label>
                <input type="date" class="form-control rounded-3" id="editDate" required>
              </div>
              <div class="col-6">
                <label for="editType" class="form-label small">類型</label>
                <select class="form-select rounded-3" id="editType" required>
                  <option value="借錢">借錢</option>
                  <option value="還錢">還錢</option>
                </select>
              </div>
              <div class="col-12">
                <label for="editAmount" class="form-label small">金額 (NT$)</label>
                <input type="number" class="form-control rounded-3" id="editAmount" min="1" required>
              </div>
              <div class="col-12">
                <label for="editNote" class="form-label small">備註說明</label>
                <input type="text" class="form-control rounded-3" id="editNote" placeholder="備註內容">
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-secondary rounded-3 px-3" data-bs-dismiss="modal">取消</button>
              <button type="submit" class="btn btn-slate-primary rounded-3 px-4">儲存變更</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- ⚙️ 系統設定與密碼變更 Modal -->
  <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content slate-card rounded-4 shadow-lg border-0">
        <div class="modal-header border-bottom border-secondary-subtle p-4">
          <h5 class="modal-title fw-bold d-flex align-items-center gap-2">
            <i data-lucide="settings" class="text-primary"></i> 系統設定與管理
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <!-- 密碼修改區塊 -->
          <div class="mb-4">
            <h6 class="fw-bold mb-3 d-flex align-items-center gap-2">
              <i data-lucide="key-round" class="text-primary" style="width:1rem;height:1rem;"></i> 修改管理員密碼
            </h6>
            <form id="changePasswordForm">
              <div class="mb-2">
                <label for="currentPassword" class="form-label small">目前密碼</label>
                <input type="password" class="form-control rounded-3" id="currentPassword" placeholder="輸入目前密碼" required>
              </div>
              <div class="mb-2">
                <label for="newPassword" class="form-label small">新密碼</label>
                <input type="password" class="form-control rounded-3" id="newPassword" placeholder="輸入新密碼" required minlength="4">
              </div>
              <div class="mb-3">
                <label for="confirmNewPassword" class="form-label small">確認新密碼</label>
                <input type="password" class="form-control rounded-3" id="confirmNewPassword" placeholder="再次輸入新密碼" required minlength="4">
              </div>
              <button type="submit" class="btn btn-sm btn-outline-primary rounded-3 w-100 py-2">更新密碼</button>
            </form>
          </div>

          <hr class="my-4 opacity-25">

          <!-- 公告管理區塊 -->
          <div>
            <h6 class="fw-bold mb-3 d-flex align-items-center gap-2">
              <i data-lucide="megaphone" class="text-primary" style="width:1rem;height:1rem;"></i> 發布系統公告
            </h6>
            <form id="addAnnouncementForm">
              <div class="mb-2">
                <label for="announceType" class="form-label small">公告類型</label>
                <select id="announceType" class="form-select rounded-3">
                  <option value="info">資訊 (藍色)</option>
                  <option value="warning">警告 (黃色)</option>
                  <option value="danger">緊急 (紅色)</option>
                  <option value="success">成功 (綠色)</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="announceContent" class="form-label small">公告內容</label>
                <input type="text" id="announceContent" class="form-control rounded-3" placeholder="例如：系統維護公告..." required>
              </div>
              <button type="submit" class="btn btn-sm btn-outline-success rounded-3 w-100 py-2">發布公告</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="mt-auto pt-5 pb-3 text-center small">
    <div class="container">
      <div class="dropdown d-inline-block mb-3">
        <button class="btn btn-sm btn-custom-dropdown dropdown-toggle rounded-pill px-3" type="button" id="themeDropdownBtn" data-bs-toggle="dropdown">
          <span id="themeDropdownLabel">主題設定</span>
        </button>
        <ul class="dropdown-menu shadow rounded-3">
          <li><a class="dropdown-item" href="#" onclick="changeTheme('light'); return false;"><i data-lucide="sun" class="text-warning me-2"></i>淺色模式</a></li>
          <li><a class="dropdown-item" href="#" onclick="changeTheme('dark'); return false;"><i data-lucide="moon" class="text-primary me-2"></i>深色模式</a></li>
          <li><hr class="dropdown-divider opacity-25"></li>
          <li><a class="dropdown-item" href="#" onclick="changeTheme('auto'); return false;"><i data-lucide="monitor" class="me-2"></i>隨系統切換</a></li>
        </ul>
      </div>
      <div class="text-sub opacity-75">Copyright © 2026.08 帳務管理系統 by Dinher</div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let API_URL = null;
    let globalHistoryData = [];
    let globalAnnouncements = [];
    let currentTotalOwed = 0;
    let currentSortOrder = 'desc';

    let tableSortKey = 'date';
    let tableSortOrder = 'desc';

    // 🔒 管理員狀態與密碼變更（預設前端測試密碼：1234，等等可接 GAS）
    let isAdminLoggedIn = false;
    let systemPassword = localStorage.getItem('ledger_admin_password') || '1234';

    // 取得使用者裝置本地時區日期
    function getLocalDateString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    document.getElementById('date').value = getLocalDateString();

    function refreshIcons() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    async function initConfig() {
      const urlParams = new URLSearchParams(window.location.search);
      let loadConfigParam = urlParams.get('load');

      if (!loadConfigParam) {
        throw new Error("網址缺少 `?load=???` 設定檔參數。");
      }

      if (!loadConfigParam.endsWith('.json')) {
        loadConfigParam += '.json';
      }

      const cleanFileName = loadConfigParam.replace(/^\/+/, '');
      const jsonUrl = `./config/${cleanFileName}`;

      const response = await fetch(jsonUrl);
      if (!response.ok) {
        throw new Error(`無法讀取設定檔 (${jsonUrl}) - HTTP ${response.status}`);
      }
      
      const config = await response.json();

      if (!config.title || !config.apiUrl) {
        throw new Error("JSON 設定檔格式不完整，需包含 `title` 與 `apiUrl` 欄位。");
      }

      document.title = config.title;
      document.getElementById('appHeaderTitle').innerText = config.title;
      API_URL = config.apiUrl;
    }

    const systemThemeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    systemThemeMedia.addEventListener('change', () => {
      if (localStorage.getItem('user-theme') === 'auto') {
        applyTheme('auto');
      }
    });

    function changeTheme(mode) {
      localStorage.setItem('user-theme', mode);
      applyTheme(mode);
    }

    function applyTheme(mode) {
      let targetTheme = mode;
      if (mode === 'auto') {
        targetTheme = systemThemeMedia.matches ? 'dark' : 'light';
      }

      document.documentElement.setAttribute('data-bs-theme', targetTheme);

      const labelMap = {
        light: '<i data-lucide="sun" class="text-warning me-1"></i> 淺色模式',
        dark: '<i data-lucide="moon" class="text-primary me-1"></i> 深色模式',
        auto: '<i data-lucide="monitor" class="me-1"></i> 隨系統切換'
      };
      document.getElementById('themeDropdownLabel').innerHTML = labelMap[mode] || labelMap.auto;
      refreshIcons();
    }

    const currentSavedTheme = localStorage.getItem('user-theme') || 'auto';
    applyTheme(currentSavedTheme);

    // 🔐 管理員驗證/登出切換
    async function toggleAdminAuth() {
      const swalStyle = getSwalStyle();

      if (isAdminLoggedIn) {
        // 登出
        isAdminLoggedIn = false;
        updateAdminUI();
        renderHistoryList();
        Swal.fire({
          icon: 'info',
          title: '已切換為一般模式',
          timer: 1500,
          showConfirmButton: false,
          background: swalStyle.background,
          color: swalStyle.color
        });
      } else {
        // 輸入密碼驗證
        const { value: password } = await Swal.fire({
          title: '請輸入管理員密碼',
          input: 'password',
          inputPlaceholder: '請輸入密碼',
          inputAttributes: {
            autocapitalize: 'off',
            autocorrect: 'off'
          },
          showCancelButton: true,
          confirmButtonText: '驗證登入',
          cancelButtonText: '取消',
          confirmButtonColor: '#2563eb',
          background: swalStyle.background,
          color: swalStyle.color
        });

        if (password) {
          if (password === systemPassword) {
            isAdminLoggedIn = true;
            updateAdminUI();
            renderHistoryList();
            Swal.fire({
              icon: 'success',
              title: '驗證成功',
              text: '已開啟編輯與管理權限',
              timer: 1500,
              showConfirmButton: false,
              background: swalStyle.background,
              color: swalStyle.color
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: '密碼錯誤',
              text: '請確認後重試！',
              background: swalStyle.background,
              color: swalStyle.color
            });
          }
        }
      }
    }

    function updateAdminUI() {
      const badge = document.getElementById('adminStatusBadge');
      const authBtnText = document.getElementById('adminAuthBtnText');
      const settingsBtn = document.getElementById('settingsBtn');

      if (isAdminLoggedIn) {
        badge.className = 'badge bg-primary-subtle text-primary admin-badge';
        badge.innerText = '管理員模式';
        authBtnText.innerText = '登出權限';
        settingsBtn.classList.remove('d-none');
      } else {
        badge.className = 'badge bg-secondary-subtle text-secondary admin-badge';
        badge.innerText = '一般檢視';
        authBtnText.innerText = '管理員驗證';
        settingsBtn.classList.add('d-none');
      }
      refreshIcons();
    }

    function openSettingsModal() {
      if (!isAdminLoggedIn) return;
      const settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));
      settingsModal.show();
    }

    function toggleSortOrder() {
      currentSortOrder = (currentSortOrder === 'desc') ? 'asc' : 'desc';
      
      const sortBtn = document.getElementById('sortBtn');
      if (currentSortOrder === 'desc') {
        sortBtn.innerHTML = `<i data-lucide="arrow-down-wide-narrow" class="text-primary"></i> <span>最新月在前</span>`;
      } else {
        sortBtn.innerHTML = `<i data-lucide="arrow-up-narrow-wide" class="text-primary"></i> <span>最舊月在前</span>`;
      }

      renderHistoryList();
    }

    function handleTableSort(key) {
      if (tableSortKey === key) {
        tableSortOrder = (tableSortOrder === 'asc') ? 'desc' : 'asc';
      } else {
        tableSortKey = key;
        tableSortOrder = (key === 'amount') ? 'desc' : 'asc';
      }
      renderHistoryList();
    }

    function getSortIconHtml(key) {
      if (tableSortKey !== key) {
        return `<i data-lucide="arrow-up-down" class="opacity-25 ms-1"></i>`;
      }
      return tableSortOrder === 'asc' 
        ? `<i data-lucide="arrow-up" class="text-primary ms-1"></i>`
        : `<i data-lucide="arrow-down" class="text-primary ms-1"></i>`;
    }

    function updateUIStats() {
      document.getElementById('totalOwed').innerText = `NT$ ${currentTotalOwed.toLocaleString()}`;
      document.getElementById('recordCount').innerText = `${globalHistoryData.length} 筆紀錄`;
    }

    function renderHistoryList() {
      const accordionContainer = document.getElementById('monthlyHistoryAccordion');

      const openCollapseIds = new Set();
      document.querySelectorAll('#monthlyHistoryAccordion .accordion-collapse.show').forEach(el => {
        openCollapseIds.add(el.id);
      });

      if (!globalHistoryData || globalHistoryData.length === 0) {
        accordionContainer.innerHTML = `<div class="text-center text-sub py-5">目前尚無任何借還記錄</div>`;
        return;
      }

      const groups = {};
      globalHistoryData.forEach((item, originalIndex) => {
        const itemWithIdx = { ...item, originalIndex };
        const monthKey = item.date ? item.date.substring(0, 7) : '未知月份';
        if (!groups[monthKey]) {
          groups[monthKey] = [];
        }
        groups[monthKey].push(itemWithIdx);
      });

      const sortedMonthKeys = Object.keys(groups).sort((a, b) => {
        return currentSortOrder === 'desc' ? b.localeCompare(a) : a.localeCompare(b);
      });

      accordionContainer.innerHTML = sortedMonthKeys.map((monthKey, index) => {
        const monthItems = groups[monthKey];

        monthItems.sort((a, b) => {
          let valA = a[tableSortKey];
          let valB = b[tableSortKey];

          if (tableSortKey === 'amount') {
            valA = Number(valA) || 0;
            valB = Number(valB) || 0;
          } else {
            valA = String(valA || '');
            valB = String(valB || '');
          }

          if (valA < valB) return tableSortOrder === 'asc' ? -1 : 1;
          if (valA > valB) return tableSortOrder === 'asc' ? 1 : -1;
          return 0;
        });

        let monthBorrowTotal = 0;
        let monthRepayTotal = 0;

        monthItems.forEach(item => {
          const amt = Number(item.amount) || 0;
          if (item.type === '借錢') monthBorrowTotal += amt;
          if (item.type === '還錢') monthRepayTotal += amt;
        });

        const netChange = monthBorrowTotal - monthRepayTotal;
        const collapseId = `collapse-${monthKey.replace('-', '')}`;
        const headingId = `heading-${monthKey.replace('-', '')}`;

        const isShow = openCollapseIds.size > 0 
          ? openCollapseIds.has(collapseId) 
          : (index === 0);

        const [year, month] = monthKey.split('-');
        const formattedMonthLabel = year && month ? `${year} 年 ${month} 月` : monthKey;

        const tableRows = monthItems.map(item => {
          const isBorrow = item.type === '借錢';
          const amt = Number(item.amount) || 0;
          
          const actionColHeader = isAdminLoggedIn ? `<th class="text-center text-nowrap" style="width:90px;">操作</th>` : '';
          const actionCell = isAdminLoggedIn ? `
            <td class="text-center text-nowrap">
              <button class="btn btn-sm btn-outline-primary p-1 py-0 me-1" title="編輯" onclick="openEditRecordModal(${item.originalIndex})">
                <i data-lucide="pencil" style="width:0.85rem;height:0.85rem;"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger p-1 py-0" title="刪除" onclick="deleteRecord(${item.originalIndex})">
                <i data-lucide="trash-2" style="width:0.85rem;height:0.85rem;"></i>
              </button>
            </td>
          ` : '';

          return `
            <tr>
              <td class="text-nowrap text-sub" style="font-size:0.85rem;">${item.date}</td>
              <td class="text-nowrap">
                <span class="badge ${isBorrow ? 'bg-danger-subtle text-danger' : 'bg-success-subtle text-success'} rounded-2 fw-normal">
                  ${item.type}
                </span>
              </td>
              <td class="fw-bold ${isBorrow ? 'text-danger' : 'text-success'} text-nowrap">
                ${isBorrow ? '+' : '-'} NT$ ${amt.toLocaleString()}
              </td>
              <td class="text-sub text-nowrap">${item.note || '-'}</td>
              ${actionCell}
            </tr>
          `;
        }).join('');

        return `
          <div class="accordion-item">
            <h2 class="accordion-header" id="${headingId}">
              <button class="accordion-button ${isShow ? '' : 'collapsed'} d-flex align-items-center justify-content-between pe-4" 
                      type="button" 
                      data-bs-toggle="collapse" 
                      data-bs-target="#${collapseId}" 
                      aria-expanded="${isShow ? 'true' : 'false'}" 
                      aria-controls="${collapseId}">
                <div class="d-flex align-items-center gap-2 flex-grow-1 me-2">
                  <i data-lucide="calendar" class="text-primary"></i>
                  <span class="fw-bold">${formattedMonthLabel}</span>
                  <span class="badge bg-secondary-subtle text-secondary rounded-pill small ms-1">${monthItems.length} 筆</span>
                </div>
                
                <div class="text-end me-2" style="font-size:0.85rem;">
                  <span class="text-sub d-none d-sm-inline">當月淨變動：</span>
                  <span class="fw-bold ${netChange > 0 ? 'text-danger' : (netChange < 0 ? 'text-success' : 'text-sub')}">
                    ${netChange > 0 ? '+' : ''}${netChange.toLocaleString()}
                  </span>
                </div>
              </button>
            </h2>
            <div id="${collapseId}" 
                 class="accordion-collapse collapse ${isShow ? 'show' : ''}" 
                 aria-labelledby="${headingId}">
              <div class="accordion-body">
                <div class="table-responsive">
                  <table class="table table-custom align-middle">
                    <thead>
                      <tr>
                        <th class="sortable text-nowrap text-center ${tableSortKey === 'date' ? 'active' : ''}" onclick="handleTableSort('date')">
                          日期 ${getSortIconHtml('date')}
                        </th>
                        <th class="sortable text-nowrap text-center ${tableSortKey === 'type' ? 'active' : ''}" onclick="handleTableSort('type')">
                          類型 ${getSortIconHtml('type')}
                        </th>
                        <th class="sortable text-nowrap text-center ${tableSortKey === 'amount' ? 'active' : ''}" onclick="handleTableSort('amount')">
                          金額 ${getSortIconHtml('amount')}
                        </th>
                        <th style="min-width: 150px;" class="text-sub text-nowrap">備註</th>
                        ${isAdminLoggedIn ? '<th class="text-center text-nowrap">操作</th>' : ''}
                      </tr>
                    </thead>
                    <tbody>
                      ${tableRows}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      refreshIcons();
    }

    function selectType(value, labelHtml) {
      document.getElementById('type').value = value;
      document.getElementById('typeDropdownLabel').innerHTML = labelHtml;
      refreshIcons();
    }

    function getSwalStyle() {
      const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
      return {
        background: isDark ? '#121212' : '#ffffff',
        color: isDark ? '#f1f5f9' : '#0f172a'
      };
    }

    const alertIconMap = {
      info: 'info',
      warning: 'triangle-alert',
      danger: 'octagon-alert',
      success: 'check-circle',
      primary: 'megaphone'
    };

    async function loadData(showLoading = true) {
      const swalStyle = getSwalStyle();

      if (showLoading) {
        Swal.fire({
          title: '資料同步中...',
          background: swalStyle.background,
          color: swalStyle.color,
          allowOutsideClick: false,
          heightAuto: false,
          customClass: {
            popup: 'swal-fullscreen-popup'
          },
          didOpen: () => Swal.showLoading()
        });
      }

      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        globalAnnouncements = data.announcements || [];
        renderAnnouncements();

        currentTotalOwed = data.totalOwed || 0;
        globalHistoryData = data.history || [];

        updateUIStats();
        renderHistoryList();

        if (showLoading) Swal.close();
      } catch (err) {
        if (showLoading) {
          Swal.fire({
            icon: 'error',
            title: '連線失敗',
            text: '無法讀取後端資料庫。',
            background: swalStyle.background,
            color: swalStyle.color,
            allowOutsideClick: false,
            showConfirmButton: true,
            confirmButtonText: '重新整理',
            confirmButtonColor: '#2563eb',
            heightAuto: false,
            customClass: {
              popup: 'swal-fullscreen-popup'
            }
          }).then((result) => {
            if (result.isConfirmed) {
              window.location.reload();
            }
          });
        }
        document.getElementById('monthlyHistoryAccordion').innerHTML = `<div class="text-center text-danger py-5">資料載入失敗</div>`;
      }
    }

    function renderAnnouncements() {
      const container = document.getElementById('announcementContainer');
      if (globalAnnouncements && globalAnnouncements.length > 0) {
        container.innerHTML = globalAnnouncements.map((item) => {
          const alertType = item.type || 'info';
          const iconName = alertIconMap[alertType] || 'megaphone';

          return `
            <div class="alert alert-${alertType} alert-dismissible fade show m-0 rounded-3 d-flex align-items-center gap-2 border-0 shadow-sm" role="alert">
              <i data-lucide="${iconName}" class="flex-shrink-0"></i>
              <div class="flex-grow-1 fw-medium">${item.content}</div>
            </div>
          `;
        }).join('');
        refreshIcons();
      } else {
        container.innerHTML = '';
      }
    }

    // 送出新增紀錄
    document.getElementById('ledgerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const alertEl = document.getElementById('submitAlert');
      const amountVal = Number(document.getElementById('amount').value);
      const typeVal = document.getElementById('type').value;
      const dateVal = document.getElementById('date').value;
      const noteVal = document.getElementById('note').value;

      if (!amountVal || amountVal <= 0) return;

      alertEl.classList.add('d-none');
      alertEl.classList.remove('show');

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> 處理中...`;

      const newRecord = {
        action: 'add',
        date: dateVal,
        type: typeVal,
        amount: amountVal,
        note: noteVal
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(newRecord)
        });
        const result = await res.json();

        if (result.status !== 'success') {
          throw new Error('寫入失敗');
        }

        if (typeVal === '借錢') {
          currentTotalOwed += amountVal;
        } else if (typeVal === '還錢') {
          currentTotalOwed -= amountVal;
        }
        globalHistoryData.unshift({
          date: dateVal,
          type: typeVal,
          amount: amountVal,
          note: noteVal
        });

        updateUIStats();
        renderHistoryList();

        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';

        alertEl.classList.remove('d-none');
        setTimeout(() => alertEl.classList.add('show'), 10);
        refreshIcons();

        setTimeout(() => {
          alertEl.classList.remove('show');
          setTimeout(() => alertEl.classList.add('d-none'), 150);
        }, 2000);

      } catch (err) {
        const swalStyle = getSwalStyle();
        Swal.fire({
          icon: 'error',
          title: '寫入失敗',
          text: '紀錄未成功寫入資料庫，請檢查網路連線。',
          background: swalStyle.background,
          color: swalStyle.color
        });
        await loadData(false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="send"></i> 送出紀錄`;
        refreshIcons();
      }
    });

    // ✏️ 開啟編輯紀錄 Modal
    function openEditRecordModal(index) {
      if (!isAdminLoggedIn) return;
      const record = globalHistoryData[index];
      if (!record) return;

      document.getElementById('editIndex').value = index;
      document.getElementById('editDate').value = record.date;
      document.getElementById('editType').value = record.type;
      document.getElementById('editAmount').value = record.amount;
      document.getElementById('editNote').value = record.note || '';

      const modal = new bootstrap.Modal(document.getElementById('editRecordModal'));
      modal.show();
    }

    // 💾 儲存編輯紀錄
    document.getElementById('editRecordForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const index = document.getElementById('editIndex').value;
      const date = document.getElementById('editDate').value;
      const type = document.getElementById('editType').value;
      const amount = Number(document.getElementById('editAmount').value);
      const note = document.getElementById('editNote').value;

      const updatedRecordPayload = {
        action: 'edit',
        index: Number(index),
        date: date,
        type: type,
        amount: amount,
        note: note
      };

      const swalStyle = getSwalStyle();

      try {
        Swal.fire({
          title: '更新中...',
          background: swalStyle.background,
          color: swalStyle.color,
          didOpen: () => Swal.showLoading()
        });

        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(updatedRecordPayload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          globalHistoryData[index] = { date, type, amount, note };
          recalculateTotalOwed();
          updateUIStats();
          renderHistoryList();

          const editModalEl = document.getElementById('editRecordModal');
          const modalInstance = bootstrap.Modal.getInstance(editModalEl);
          if (modalInstance) modalInstance.hide();

          Swal.fire({
            icon: 'success',
            title: '修改成功',
            timer: 1500,
            showConfirmButton: false,
            background: swalStyle.background,
            color: swalStyle.color
          });
        } else {
          throw new Error('伺服器更新失敗');
        }
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: '修改失敗',
          text: err.message,
          background: swalStyle.background,
          color: swalStyle.color
        });
      }
    });

    // 🗑️ 刪除紀錄
    async function deleteRecord(index) {
      if (!isAdminLoggedIn) return;
      const record = globalHistoryData[index];
      if (!record) return;

      const swalStyle = getSwalStyle();

      const confirm = await Swal.fire({
        title: '確定要刪除這筆紀錄？',
        text: `${record.date} | ${record.type} | NT$ ${record.amount}`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: '確定刪除',
        cancelButtonText: '取消',
        background: swalStyle.background,
        color: swalStyle.color
      });

      if (confirm.isConfirmed) {
        try {
          Swal.fire({
            title: '刪除中...',
            background: swalStyle.background,
            color: swalStyle.color,
            didOpen: () => Swal.showLoading()
          });

          const deletePayload = {
            action: 'delete',
            index: index
          };

          const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(deletePayload)
          });
          const result = await res.json();

          if (result.status === 'success') {
            globalHistoryData.splice(index, 1);
            recalculateTotalOwed();
            updateUIStats();
            renderHistoryList();

            Swal.fire({
              icon: 'success',
              title: '已刪除紀錄',
              timer: 1500,
              showConfirmButton: false,
              background: swalStyle.background,
              color: swalStyle.color
            });
          } else {
            throw new Error('伺服器刪除失敗');
          }
        } catch (err) {
          Swal.fire({
            icon: 'error',
            title: '刪除失敗',
            text: err.message,
            background: swalStyle.background,
            color: swalStyle.color
          });
        }
      }
    }

    function recalculateTotalOwed() {
      let total = 0;
      globalHistoryData.forEach(item => {
        const amt = Number(item.amount) || 0;
        if (item.type === '借錢') total += amt;
        if (item.type === '還錢') total -= amt;
      });
      currentTotalOwed = total;
    }

    // 🔑 修改密碼表單處理
    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const currentPwd = document.getElementById('currentPassword').value;
      const newPwd = document.getElementById('newPassword').value;
      const confirmPwd = document.getElementById('confirmNewPassword').value;
      const swalStyle = getSwalStyle();

      if (currentPwd !== systemPassword) {
        Swal.fire({
          icon: 'error',
          title: '舊密碼錯誤',
          text: '請確認目前的密碼！',
          background: swalStyle.background,
          color: swalStyle.color
        });
        return;
      }

      if (newPwd !== confirmPwd) {
        Swal.fire({
          icon: 'error',
          title: '新密碼不一致',
          text: '兩次輸入的新密碼必須完全相同！',
          background: swalStyle.background,
          color: swalStyle.color
        });
        return;
      }

      try {
        systemPassword = newPwd;
        localStorage.setItem('ledger_admin_password', newPwd);

        // 發送給 GAS 後端備份更新 (若有實作 updatePassword)
        fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'updatePassword', password: newPwd })
        }).catch(err => console.log('GAS sync offline'));

        Swal.fire({
          icon: 'success',
          title: '密碼已更新',
          text: '新密碼設定成功！',
          timer: 1500,
          showConfirmButton: false,
          background: swalStyle.background,
          color: swalStyle.color
        });

        document.getElementById('changePasswordForm').reset();
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: '密碼更新失敗',
          text: err.message,
          background: swalStyle.background,
          color: swalStyle.color
        });
      }
    });

    // 📢 新增公告表單處理
    document.getElementById('addAnnouncementForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const type = document.getElementById('announceType').value;
      const content = document.getElementById('announceContent').value;
      const swalStyle = getSwalStyle();

      try {
        const payload = {
          action: 'addAnnouncement',
          type: type,
          content: content
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        globalAnnouncements.push({ type, content });
        renderAnnouncements();

        document.getElementById('addAnnouncementForm').reset();

        Swal.fire({
          icon: 'success',
          title: '公告已發布',
          timer: 1500,
          showConfirmButton: false,
          background: swalStyle.background,
          color: swalStyle.color
        });
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: '發布失敗',
          text: err.message,
          background: swalStyle.background,
          color: swalStyle.color
        });
      }
    });

    async function startApp() {
      const swalStyle = getSwalStyle();

      try {
        await initConfig();
        await loadData(true);
      } catch (err) {
        console.error("應用程式初始化失敗:", err.message);

        Swal.fire({
          icon: 'error',
          title: '系統載入失敗',
          text: err.message,
          background: swalStyle.background,
          color: swalStyle.color,
          allowOutsideClick: false,
          showConfirmButton: true,
          confirmButtonText: '重新整理',
          confirmButtonColor: '#2563eb',
          heightAuto: false,
          customClass: {
            popup: 'swal-fullscreen-popup'
          }
        }).then((result) => {
          if (result.isConfirmed) {
            window.location.reload();
          }
        });

        document.getElementById('monthlyHistoryAccordion').innerHTML = `
          <div class="text-center text-danger py-5 fw-bold">
            <i data-lucide="circle-alert" style="width: 2.5rem; height: 2.5rem;" class="d-block mx-auto mb-2"></i>
            ${err.message}
          </div>`;
        refreshIcons();
      }
    }

    startApp();
  </script>
</body>
</html>
