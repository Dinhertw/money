<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蔡東珉的帳務管理系統</title>

  <!-- ========================================================= -->
  <!-- 📱 PWA 設定區塊 -->
  <!-- ========================================================= -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "蔡東珉的帳務管理系統",
    "short_name": "蔡東珉的帳務",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#121212",
    "theme_color": "#2563eb",
    "icons": [{
      "src": "https://dinhertw.github.io/money/icon.png",
      "sizes": "512x512",
      "type": "image/png"
    }]
  }'>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="記帳App">
  <link rel="apple-touch-icon" href="https://dinhertw.github.io/money/icon.png">
  <link rel="icon" type="image/png" href="https://dinhertw.github.io/money/icon.png">
  
  <!-- Bootstrap 5.3 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- SweetAlert2 彈出視窗套件 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
/* 🎨 深色模式 (Dark Mode) - 黑灰色調優化 */
[data-bs-theme="dark"] {
  --app-bg: #121212;                           /* 主背景：純極深黑灰 */
  --card-bg: #1e1e1e;                          /* 卡片背景：深灰 */
  --card-border: #2d2d2d;                      /* 卡片邊框：中暗灰 */
  --input-bg: #262626;                         /* 輸入框與按鈕：暗灰 */
  --text-primary: #f1f5f9;                     /* 主要文字：高對比亮白 */
  --text-secondary: #a1a1aa;                   /* 次要文字：霧灰 */
  --hero-bg: linear-gradient(135deg, #1f242d 0%, #161a22 100%); /* Hero區塊微漸層 */
  --hero-title: #ffffff;
  --date-picker-filter: invert(0.8);
  --accordion-btn-bg: #1e1e1e;
  --accordion-btn-active-bg: #2a2a2a;         /* 手風琴展開頭部：亮深灰 */
  --table-hover-bg: #262626;                   /* 表格懸停：暗灰 */
  --th-hover-bg: #333333;                      /* 表頭懸停：深灰 */
}

/* ☀️ 淺色模式 (Light Mode) 顏色變數 */
[data-bs-theme="light"] {
  --app-bg: #f8fafc;
  --card-bg: #ffffff;
  --card-border: #e2e8f0;
  --input-bg: #f1f5f9;
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --hero-bg: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
  --hero-title: #1e3a8a;
  --date-picker-filter: none;
  --accordion-btn-bg: #ffffff;
  --accordion-btn-active-bg: #f1f5f9;
  --table-hover-bg: #f8fafc;
  --th-hover-bg: #e2e8f0;
}

body {
  background-color: var(--app-bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: system-ui, -apple-system, sans-serif;
  transition: background-color 0.2s, color 0.2s;
}

.slate-card {
  background-color: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.hero-card {
  background: var(--hero-bg);
  border: 1px solid var(--card-border);
}

.hero-card .hero-amount {
  color: var(--hero-title);
}

.form-label, label, small, .small, .text-sub {
  color: var(--text-secondary) !important;
  font-weight: 500;
}

.form-control, .form-select, .btn-custom-dropdown {
  background-color: var(--input-bg) !important;
  border: 1px solid var(--card-border) !important;
  color: var(--text-primary) !important;
}

.form-control:focus, .form-select:focus, .btn-custom-dropdown:focus {
  border-color: #3b82f6 !important;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
}

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: var(--date-picker-filter);
  cursor: pointer;
}

.btn-slate-primary {
  background-color: #2563eb;
  border: none;
  color: #ffffff;
  font-weight: 600;
}

.btn-slate-primary:hover {
  background-color: #1d4ed8;
  color: #ffffff;
}

.dropdown-menu {
  background-color: var(--card-bg) !important;
  border: 1px solid var(--card-border) !important;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4) !important;
}

.dropdown-item { color: var(--text-primary) !important; }
.dropdown-item:hover { background-color: var(--input-bg) !important; }

/* 📊 表格與手風琴樣式優化 */
.accordion-item {
  background-color: transparent !important;
  border: 1px solid var(--card-border) !important;
  border-radius: 12px !important;
  overflow: hidden;
  margin-bottom: 0.75rem;
}

.accordion-button {
  background-color: var(--accordion-btn-bg) !important;
  color: var(--text-primary) !important;
  box-shadow: none !important;
  padding: 1rem 1.25rem;
}

.accordion-button:not(.collapsed) {
  background-color: var(--accordion-btn-active-bg) !important;
}

.accordion-body {
  background-color: var(--card-bg) !important;
  padding: 0;
}

.table-custom {
  margin-bottom: 0;
  color: var(--text-primary) !important;
}

.table-custom th {
  background-color: var(--input-bg);
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--card-border);
  padding: 0.75rem 1rem;
  user-select: none;
}

/* 🟢 可排序表頭樣式 */
.table-custom th.sortable {
  cursor: pointer;
  transition: background-color 0.15s ease-in-out, color 0.15s ease-in-out;
}

.table-custom th.sortable:hover {
  background-color: var(--th-hover-bg);
  color: var(--text-primary);
}

.table-custom th.sortable.active {
  color: #60a5fa;
}

.table-custom td {
  border-bottom: 1px solid var(--card-border);
  padding: 0.85rem 1rem;
  vertical-align: middle;
  font-size: 0.95rem;
}

.table-custom tr:last-child td {
  border-bottom: none;
}

.table-custom tbody tr:hover {
  background-color: var(--table-hover-bg);
}

/* 📱 RWD 高度處理 */
@media (min-width: 992px) {
  .history-container {
    max-height: 580px;
    overflow-y: auto;
  }
}

@media (max-width: 991.98px) {
  .history-container {
    max-height: none !important;
    overflow-y: visible !important;
  }
}
  </style>
</head>
<body class="py-4">

  <div class="container flex-grow-1" style="max-width: 1000px;">
    
    <!-- 📢 多個公告動態渲染區域 -->
    <div id="announcementContainer" class="d-flex flex-column gap-2 mb-4"></div>

    <div class="row g-4">
      
      <!-- 左側：輸入表單與總額 -->
      <div class="col-12 col-lg-5">
        <div class="d-flex flex-column gap-3 sticky-lg-top" style="top: 1.5rem; z-index: 10;">
          
          <!-- 待還總額顯示卡片 -->
          <div class="card slate-card hero-card p-3">
            <div class="card-body">
              <div class="d-flex align-items-center gap-2 mb-2">
                <i class="bi bi-wallet2 text-primary fs-5"></i>
                <span class="text-sub">目前待還總金額</span>
              </div>
              <h2 class="display-6 fw-bold mb-0 hero-amount" id="totalOwed">NT$ --</h2>
            </div>
          </div>

          <!-- 新增紀錄表單 -->
          <div class="card slate-card">
            <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
              <h5 class="card-title fw-bold m-0 d-flex align-items-center gap-2">
                <i class="bi bi-pencil-square text-primary"></i> 新增紀錄
              </h5>
            </div>
            <div class="card-body p-4">
              <form id="ledgerForm">
                <div class="row g-3">
                  
                  <div class="col-6">
                    <label for="date" class="form-label small">日期</label>
                    <input type="date" class="form-control rounded-3" id="date" required>
                  </div>

                  <div class="col-6">
                    <label class="form-label small">類型</label>
                    <input type="hidden" id="type" value="借錢">
                    <div class="dropdown">
                      <button class="btn btn-custom-dropdown dropdown-toggle w-100 rounded-3 text-start d-flex align-items-center justify-content-between" type="button" id="typeDropdownBtn" data-bs-toggle="dropdown">
                        <span id="typeDropdownLabel"><i class="bi bi-arrow-up-right-square text-danger me-1"></i> 借錢</span>
                      </button>
                      <ul class="dropdown-menu dropdown-menu-end w-100 rounded-3">
                        <li>
                          <a class="dropdown-item py-2" href="#" onclick="selectType('借錢', '<i class=\'bi bi-arrow-up-right-square text-danger me-1\'></i> 借錢'); return false;">
                            <i class="bi bi-arrow-up-right-square text-danger me-1"></i> 借錢
                          </a>
                        </li>
                        <li>
                          <a class="dropdown-item py-2" href="#" onclick="selectType('還錢', '<i class=\'bi bi-arrow-down-left-square text-success me-1\'></i> 還錢'); return false;">
                            <i class="bi bi-arrow-down-left-square text-success me-1"></i> 還錢
                          </a>
                        </li>
                      </ul>
                    </div>
                  </div>

                  <div class="col-12">
                    <label for="amount" class="form-label small">金額 (NT$)</label>
                    <input type="number" class="form-control rounded-3" id="amount" min="1" required placeholder="例如：100">
                  </div>
                  <div class="col-12">
                    <label for="note" class="form-label small">備註說明</label>
                    <input type="text" class="form-control rounded-3" id="note" placeholder="例如：午餐、飲料、轉帳">
                  </div>
                  <div class="col-12 pt-2">
                    <button type="submit" class="btn btn-slate-primary w-100 py-2.5 rounded-3 d-flex align-items-center justify-content-center gap-2" id="submitBtn">
                      <i class="bi bi-send-fill"></i> 送出紀錄
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>

        </div>
      </div>

      <!-- 右側：歷史紀錄清單 (按月分組手風琴 + 表格樣式) -->
      <div class="col-12 col-lg-7">
        <div class="card slate-card">
          <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0 d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
              <h5 class="card-title fw-bold m-0 d-flex align-items-center gap-2">
                <i class="bi bi-clock-history text-primary"></i> 歷史紀錄
              </h5>
              <span class="badge bg-secondary-subtle text-secondary rounded-pill px-2.5 py-1 fw-normal small" id="recordCount">0 筆</span>
            </div>

            <!-- 🔄 排序切換按鈕 (月份層級) -->
            <button class="btn btn-sm btn-custom-dropdown rounded-pill px-3 py-1 d-flex align-items-center gap-1.5" onclick="toggleSortOrder()" id="sortBtn">
              <i class="bi bi-sort-down text-primary"></i> <span id="sortLabel">最新月在前</span>
            </button>
          </div>

          <div class="card-body p-4">
            <div class="history-container">
              <!-- 按月折疊面板將會渲染在下面這個 accordion 中 -->
              <div class="accordion" id="monthlyHistoryAccordion">
                <div class="text-center text-sub py-5">載入中...</div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 頁尾：主題選單 -->
  <footer class="mt-auto pt-5 pb-3 text-center small">
    <div class="container">
      <div class="dropdown d-inline-block mb-3">
        <button class="btn btn-sm btn-custom-dropdown dropdown-toggle rounded-pill px-3" type="button" id="themeDropdownBtn" data-bs-toggle="dropdown">
          <span id="themeDropdownLabel">主題設定</span>
        </button>
        <ul class="dropdown-menu shadow rounded-3">
          <li><a class="dropdown-item" href="#" onclick="changeTheme('light'); return false;"><i class="bi bi-sun-fill text-warning me-2"></i>淺色模式</a></li>
          <li><a class="dropdown-item" href="#" onclick="changeTheme('dark'); return false;"><i class="bi bi-moon-stars-fill text-primary me-2"></i>深色模式</a></li>
          <li><hr class="dropdown-divider opacity-25"></li>
          <li><a class="dropdown-item" href="#" onclick="changeTheme('auto'); return false;"><i class="bi bi-display me-2"></i>隨系統切換</a></li>
        </ul>
      </div>
      <div class="text-sub opacity-75">Copyright © 2026.07 帳務管理系統 by Dinher</div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ⚠️ 請替換為你的 Google Apps Script URL
    const API_URL = "https://script.google.com/macros/s/AKfycbzPD5HaTMzlLEa6HWVB196IX_4BMsPg8U8zUUKbrSoGLYMCVnU8WEJfvw0HLtdg8ntz/exec";

    // 預設日期輸入框為「今天」
    // 取得手機系統當前時區的 YYYY-MM-DD
    const localDate = new Intl.DateTimeFormat('en-CA', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).format(new Date());
    
    // 直接填入 input
    document.getElementById('date').value = localDate;

    // 全局變數
    let globalHistoryData = [];
    let currentTotalOwed = 0;      // 記錄當前待還總金額
    let currentSortOrder = 'desc'; // 月份排序：'desc': 最新月在前, 'asc': 最舊月在前

    // 📊 表格內部欄位排序狀態
    let tableSortKey = 'date';    // 預設依 'date' 排序
    let tableSortOrder = 'desc';  // 預設最新日期在前 ('desc' / 'asc')


    // ==========================================
    // 🚀 PWA Service Worker 註冊
    // ==========================================
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }


    // ==========================================
    // 🎨 主題切換邏輯
    // ==========================================
    const systemThemeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    systemThemeMedia.addEventListener('change', () => {
      if (localStorage.getItem('user-theme') === 'auto') {
        applyTheme('auto');
      }
    });

    function changeTheme(mode) {
      localStorage.setItem('user-theme', mode);
      applyTheme(mode);
    }

    function applyTheme(mode) {
      let targetTheme = mode;
      if (mode === 'auto') {
        targetTheme = systemThemeMedia.matches ? 'dark' : 'light';
      }

      document.documentElement.setAttribute('data-bs-theme', targetTheme);

      const labelMap = {
        light: '<i class="bi bi-sun-fill text-warning me-1"></i> 淺色模式',
        dark: '<i class="bi bi-moon-stars-fill text-primary me-1"></i> 深色模式',
        auto: '<i class="bi bi-display me-1"></i> 隨系統切換'
      };
      document.getElementById('themeDropdownLabel').innerHTML = labelMap[mode] || labelMap.auto;
    }

    const currentSavedTheme = localStorage.getItem('user-theme') || 'auto';
    applyTheme(currentSavedTheme);


    // ==========================================
    // 🔄 歷史紀錄按月分組與表格渲染 logic
    // ==========================================

    function toggleSortOrder() {
      currentSortOrder = (currentSortOrder === 'desc') ? 'asc' : 'desc';
      
      const sortBtn = document.getElementById('sortBtn');
      if (currentSortOrder === 'desc') {
        sortBtn.innerHTML = `<i class="bi bi-sort-down text-primary"></i> <span>最新月在前</span>`;
      } else {
        sortBtn.innerHTML = `<i class="bi bi-sort-up text-primary"></i> <span>最舊月在前</span>`;
      }

      renderHistoryList();
    }

    // 🎯 處理表格欄位點擊排序
    function handleTableSort(key) {
      if (tableSortKey === key) {
        tableSortOrder = (tableSortOrder === 'asc') ? 'desc' : 'asc';
      } else {
        tableSortKey = key;
        tableSortOrder = (key === 'amount') ? 'desc' : 'asc';
      }
      renderHistoryList();
    }

    // 產生表頭箭頭圖示 HTML
    function getSortIconHtml(key) {
      if (tableSortKey !== key) {
        return `<i class="bi bi-arrow-down-up opacity-25 ms-1"></i>`;
      }
      return tableSortOrder === 'asc' 
        ? `<i class="bi bi-arrow-up text-primary ms-1"></i>`
        : `<i class="bi bi-arrow-down text-primary ms-1"></i>`;
    }

    // 更新介面上的總額與筆數顯示
    function updateUIStats() {
      document.getElementById('totalOwed').innerText = `NT$ ${currentTotalOwed.toLocaleString()}`;
      document.getElementById('recordCount').innerText = `${globalHistoryData.length} 筆紀錄`;
    }

    // 將歷史紀錄按照「YYYY年MM月」進行分組與渲染
    function renderHistoryList() {
      const accordionContainer = document.getElementById('monthlyHistoryAccordion');

      // 記憶目前哪些 Accordion 是開啟狀態 (show)
      const openCollapseIds = new Set();
      document.querySelectorAll('#monthlyHistoryAccordion .accordion-collapse.show').forEach(el => {
        openCollapseIds.add(el.id);
      });

      if (!globalHistoryData || globalHistoryData.length === 0) {
        accordionContainer.innerHTML = `<div class="text-center text-sub py-5">目前尚無任何借還記錄</div>`;
        return;
      }

      // 1. 將資料按月份 (YYYY-MM) 分組
      const groups = {};
      globalHistoryData.forEach(item => {
        const monthKey = item.date ? item.date.substring(0, 7) : '未知月份';
        if (!groups[monthKey]) {
          groups[monthKey] = [];
        }
        groups[monthKey].push(item);
      });

      // 2. 取得排序後的月份 Key 陣列
      const sortedMonthKeys = Object.keys(groups).sort((a, b) => {
        return currentSortOrder === 'desc' ? b.localeCompare(a) : a.localeCompare(b);
      });

      // 3. 生成 Accordion 與 Table HTML
      accordionContainer.innerHTML = sortedMonthKeys.map((monthKey, index) => {
        const monthItems = groups[monthKey];

        // 依據 tableSortKey & tableSortOrder 排序該月份內部的項目
        monthItems.sort((a, b) => {
          let valA = a[tableSortKey];
          let valB = b[tableSortKey];

          if (tableSortKey === 'amount') {
            valA = Number(valA) || 0;
            valB = Number(valB) || 0;
          } else {
            valA = String(valA || '');
            valB = String(valB || '');
          }

          if (valA < valB) return tableSortOrder === 'asc' ? -1 : 1;
          if (valA > valB) return tableSortOrder === 'asc' ? 1 : -1;
          return 0;
        });

        // 計算該月份的小計數據
        let monthBorrowTotal = 0;
        let monthRepayTotal = 0;

        monthItems.forEach(item => {
          const amt = Number(item.amount) || 0;
          if (item.type === '借錢') monthBorrowTotal += amt;
          if (item.type === '還錢') monthRepayTotal += amt;
        });

        const netChange = monthBorrowTotal - monthRepayTotal;
        const collapseId = `collapse-${monthKey.replace('-', '')}`;
        const headingId = `heading-${monthKey.replace('-', '')}`;

        // 判斷是否應該展開
        const isShow = openCollapseIds.size > 0 
          ? openCollapseIds.has(collapseId) 
          : (index === 0);

        // 格式化月份顯示名稱
        const [year, month] = monthKey.split('-');
        const formattedMonthLabel = year && month ? `${year} 年 ${month} 月` : monthKey;

        // 生成表格內容
        const tableRows = monthItems.map(item => {
          const isBorrow = item.type === '借錢';
          const amt = Number(item.amount) || 0;
          return `
            <tr>
              <td class="text-nowrap text-sub" style="font-size:0.85rem;">${item.date}</td>
              <td class="text-nowrap">
                <span class="badge ${isBorrow ? 'bg-danger-subtle text-danger' : 'bg-success-subtle text-success'} rounded-2 fw-normal">
                  ${item.type}
                </span>
              </td>
              <td class="fw-bold ${isBorrow ? 'text-danger' : 'text-success'} text-nowrap">
                ${isBorrow ? '+' : '-'} NT$ ${amt.toLocaleString()}
              </td>
              <td class="text-sub">${item.note || '-'}</td>
            </tr>
          `;
        }).join('');

        return `
          <div class="accordion-item">
            <h2 class="accordion-header" id="${headingId}">
              <button class="accordion-button ${isShow ? '' : 'collapsed'} d-flex align-items-center justify-content-between pe-4" 
                      type="button" 
                      data-bs-toggle="collapse" 
                      data-bs-target="#${collapseId}" 
                      aria-expanded="${isShow ? 'true' : 'false'}" 
                      aria-controls="${collapseId}">
                <div class="d-flex align-items-center gap-2 flex-grow-1 me-2">
                  <i class="bi bi-calendar3 text-primary"></i>
                  <span class="fw-bold">${formattedMonthLabel}</span>
                  <span class="badge bg-secondary-subtle text-secondary rounded-pill small ms-1">${monthItems.length} 筆</span>
                </div>
                
                <!-- 月度小計 summary -->
                <div class="text-end me-2" style="font-size:0.85rem;">
                  <span class="text-sub d-none d-sm-inline">當月淨變動：</span>
                  <span class="fw-bold ${netChange > 0 ? 'text-danger' : (netChange < 0 ? 'text-success' : 'text-sub')}">
                    ${netChange > 0 ? '+' : ''}${netChange.toLocaleString()}
                  </span>
                </div>
              </button>
            </h2>
            <div id="${collapseId}" 
                 class="accordion-collapse collapse ${isShow ? 'show' : ''}" 
                 aria-labelledby="${headingId}">
              <div class="accordion-body">
                <div class="table-responsive">
                  <table class="table table-custom align-middle">
                    <thead>
                      <tr>
                        <th style="width: 30%;min-width: 90px;" class="sortable ${tableSortKey === 'date' ? 'active' : ''}" onclick="handleTableSort('date')">
                          日期 ${getSortIconHtml('date')}
                        </th>
                        <th style="width: 30%;min-width: 90px;" class="sortable ${tableSortKey === 'type' ? 'active' : ''}" onclick="handleTableSort('type')">
                          類型 ${getSortIconHtml('type')}
                        </th>
                        <th style="width: 30%;min-width: 90px;" class="sortable ${tableSortKey === 'amount' ? 'active' : ''}" onclick="handleTableSort('amount')">
                          金額 ${getSortIconHtml('amount')}
                        </th>
                        <th style="min-width: 150px;">備註</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${tableRows}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }


    // ==========================================
    // 🛠️ API 資料串接
    // ==========================================

    function selectType(value, labelHtml) {
      document.getElementById('type').value = value;
      document.getElementById('typeDropdownLabel').innerHTML = labelHtml;
    }

    function getSwalStyle() {
      const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
      return {
        background: isDark ? '#1e2330' : '#ffffff',
        color: isDark ? '#e2e8f0' : '#0f172a'
      };
    }

    const alertIconMap = {
      info: 'bi-info-circle-fill',
      warning: 'bi-exclamation-triangle-fill',
      danger: 'bi-slash-circle-fill',
      success: 'bi-check-circle-fill',
      primary: 'bi-megaphone-fill'
    };

    // 從 Google Sheet 載入資料 (showLoading 控制是否要跳全螢幕遮罩)
    async function loadData(showLoading = true) {
      const swalStyle = getSwalStyle();

      if (showLoading) {
        Swal.fire({
          title: '資料同步中...',
          background: swalStyle.background,
          color: swalStyle.color,
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });
      }

      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        // 1. 渲染公告欄
        const container = document.getElementById('announcementContainer');
        if (data.announcements && data.announcements.length > 0) {
          container.innerHTML = data.announcements.map((item) => {
            const alertType = item.type || 'info';
            const iconClass = alertIconMap[alertType] || 'bi-megaphone-fill';

            return `
              <div class="alert alert-${alertType} alert-dismissible fade show m-0 rounded-3 d-flex align-items-center gap-2 border-0 shadow-sm" role="alert">
                <i class="bi ${iconClass} fs-5 flex-shrink-0"></i>
                <div class="flex-grow-1 fw-medium">${item.content}</div>
              </div>
            `;
          }).join('');
        } else {
          container.innerHTML = '';
        }

        // 2. 更新資料
        currentTotalOwed = data.totalOwed || 0;
        globalHistoryData = data.history || [];

        // 3. 渲染 UI
        updateUIStats();
        renderHistoryList();

        if (showLoading) Swal.close();
      } catch (err) {
        if (showLoading) {
          Swal.fire({
            icon: 'error',
            title: '連線失敗',
            text: '無法載入資料。',
            background: swalStyle.background,
            color: swalStyle.color,
            allowOutsideClick: false,
            showConfirmButton: false
          });
        }
        document.getElementById('monthlyHistoryAccordion').innerHTML = `<div class="text-center text-danger py-5">資料載入失敗</div>`;
      }
    }

    // ⚡ 樂觀更新 (Optimistic UI) 表單送出處理
    document.getElementById('ledgerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const amountVal = Number(document.getElementById('amount').value);
      const typeVal = document.getElementById('type').value;
      const dateVal = document.getElementById('date').value;
      const noteVal = document.getElementById('note').value;

      if (!amountVal || amountVal <= 0) return;

      const newRecord = {
        date: dateVal,
        type: typeVal,
        amount: amountVal,
        note: noteVal
      };

      // 1. ⚡ 即時更新本地數據 (不必等網路回應)
      if (typeVal === '借錢') {
        currentTotalOwed += amountVal;
      } else if (typeVal === '還錢') {
        currentTotalOwed -= amountVal;
      }
      globalHistoryData.unshift(newRecord); // 新紀錄插到第一個

      // 2. ⚡ 立即更新 UI 與畫面
      updateUIStats();
      renderHistoryList();

      // 清空表單欄位
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';

      // 輕量提示 (Toast) 通知使用者已新增
      const swalStyle = getSwalStyle();
      Swal.fire({
        icon: 'success',
        title: '已記錄！',
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 1500,
        background: swalStyle.background,
        color: swalStyle.color
      });

      // 3. 🌐 在背景秘密發送請求給後端 Google Sheet
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(newRecord)
        });
        const result = await res.json();

        if (result.status !== 'success') {
          throw new Error('寫入失敗');
        }

        // 後端寫入成功後，可以在背景悄悄 re-fetch 一次確保數據精確
        loadData(false);

      } catch (err) {
        // ❌ 若背景寫入失敗，彈出提示警告
        Swal.fire({
          icon: 'error',
          title: '背景同步失敗',
          text: '剛才新增的紀錄未成功寫入資料庫，請檢查網路連線。',
          background: swalStyle.background,
          color: swalStyle.color
        });
        // 失敗時重新同步真實後端資料
        loadData(false);
      }
    });

    // 啟動載入
    loadData(true);
  </script>
</body>
</html>
