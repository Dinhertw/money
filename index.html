<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳務管理系統</title> <!-- 預設標題 -->
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* 避免出現雙重捲軸 */
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="gasFrame" allowfullscreen></iframe>

  <script>
// 1. 監聽來自 iframe 的訊息
  window.addEventListener('message', function(event) {
    // 【加入這行來印出收到的資料】
    console.log("收到來自 GAS 的訊息：", event.data);

    if (event.data && event.data.type === 'setTitle' && event.data.title) {
      document.title = event.data.title;
      console.log("分頁標題已成功更改為：", event.data.title);
    }
  });

  // 載入 iframe 邏輯...
  const queryString = window.location.search;
  const gasBaseUrl = "https://script.google.com/macros/s/AKfycbxP0BpEun_t9OWNh0J0SrybPkkkb83a4QiKdEN6UHjwLziHjdwcQhGYAu0e67DCDdJt5w/exec";
  document.getElementById('gasFrame').src = gasBaseUrl + queryString;
  </script>
</body>
</html>
