<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="light">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳務管理系統</title>

  <link rel="icon" type="image/png" href="https://dinhertw.github.io/money/icon.png">
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Lucide Icons 套件 -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SweetAlert2 彈出視窗套件 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* 🎨 深色模式 (Dark Mode) */
    [data-bs-theme="dark"] {
      --app-bg: #121212;
      --card-bg: #1e1e1e;
      --card-border: #2d2d2d;
      --input-bg: #262626;
      --text-primary: #f1f5f9;
      --text-secondary: #a1a1aa;
      --hero-bg: linear-gradient(135deg, #1f242d 0%, #161a22 100%);
      --hero-title: #ffffff;
      --date-picker-filter: invert(0.8);
      --accordion-btn-bg: #1e1e1e;
      --accordion-btn-active-bg: #2a2a2a;
      --table-hover-bg: #262626;

      /* UI Specific */
      --badge-lend-bg: rgba(224, 86, 105, 0.2);
      --badge-lend-text: #f87171;
      --badge-repay-bg: rgba(40, 167, 69, 0.2);
      --badge-repay-text: #4ade80;
      --amount-lend-text: #f87171;
      --amount-repay-text: #34d399;
    }
    
    /* ☀️ 淺色模式 (Light Mode) */
    [data-bs-theme="light"] {
      --app-bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --input-bg: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --hero-bg: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      --hero-title: #1e3a8a;
      --date-picker-filter: none;
      --accordion-btn-bg: #ffffff;
      --accordion-btn-active-bg: #f8fafc;
      --table-hover-bg: #f8fafc;

      /* UI Specific */
      --badge-lend-bg: #fce8e6;
      --badge-lend-text: #dc2626;
      --badge-repay-bg: #e6f4ea;
      --badge-repay-text: #16a34a;
      --amount-lend-text: #dc2626;
      --amount-repay-text: #16a34a;
    }

    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
    }
    
    body {
      background-color: var(--app-bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.2s, color 0.2s;
      padding-top: 1rem !important;
      padding-bottom: 1.5rem !important;
    }
    
    .slate-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
    }
    
    .hero-card {
      background: var(--hero-bg);
      border: 1px solid var(--card-border);
    }
    
    .hero-card .hero-amount {
      color: var(--hero-title);
    }
    
    .form-label, label, small, .small, .text-sub {
      color: var(--text-secondary) !important;
      font-weight: 500;
    }
    
    .form-control, .form-select, .btn-custom-dropdown {
      background-color: var(--input-bg) !important;
      border: 1px solid var(--card-border) !important;
      color: var(--text-primary) !important;
    }
    
    .form-control:focus, .form-select:focus, .btn-custom-dropdown:focus{
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
    }
    
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: var(--date-picker-filter);
      cursor: pointer;
    }
    
    .btn-slate-primary {
      background-color: #2563eb;
      border: none;
      color: #ffffff;
      font-weight: 600;
    }
    
    .btn-slate-primary:hover {
      background-color: #1d4ed8;
      color: #ffffff;
    }
    
    .dropdown-menu {
      background-color: var(--card-bg) !important;
      border: 1px solid var(--card-border) !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4) !important;
    }
    
    .dropdown-item { color: var(--text-primary) !important; }
    .dropdown-item:hover { background-color: var(--input-bg) !important; }
    
    .accordion-item {
      background-color: transparent !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 12px !important;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    
    .accordion-button {
      background-color: var(--accordion-btn-bg) !important;
      color: var(--text-primary) !important;
      box-shadow: none !important;
      padding: 1rem 1.25rem;
    }
    
    .accordion-button:not(.collapsed) {
      background-color: var(--accordion-btn-active-bg) !important;
    }
    
    .accordion-body {
      background-color: var(--card-bg) !important;
      padding: 0;
    }
    
    /* 📊 表格樣式調整 */
    .table-custom {
      margin-bottom: 0;
      color: var(--text-primary) !important;
    }
    
    .table-custom th {
      background-color: transparent;
      color: #64748b;
      font-weight: 600;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--card-border);
      padding: 0.8rem 1rem;
      user-select: none;
    }
    
    .table-custom th.sortable {
      cursor: pointer;
      transition: color 0.15s ease-in-out;
    }
    
    .table-custom th.sortable:hover {
      color: var(--text-primary);
    }
    
    .table-custom th.sortable.active {
      color: #3b82f6;
    }
    
    .table-custom td {
      border-bottom: 1px solid var(--card-border);
      padding: 0.9rem 1rem;
      vertical-align: middle;
      font-size: 0.95rem;
    }

    /* ✏️ 歷史紀錄編輯元件：無外框透視風格 */
    .edit-input-clean {
      background-color: transparent !important;
      border: 1px solid transparent !important;
      box-shadow: none !important;
      padding: 0.25rem 0.5rem;
      font-size: 0.95rem;
      border-radius: 6px;
      transition: border-color 0.15s ease-in-out, background-color 0.15s ease-in-out;
      text-align: left !important;
    }

    .edit-input-clean:hover,
    .edit-input-clean:focus {
      background-color: var(--input-bg) !important;
      border-color: var(--card-border) !important;
    }

    .edit-input-clean:focus {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2) !important;
    }

    /* 寬度拉長的備註格子 */
    .edit-note-input {
      width: 100%;
      min-width: 180px;
      text-align: left; /* 改為靠左 */
    }

    tr.pending-deleted {
      opacity: 0.4;
      text-decoration: line-through;
      background-color: rgba(220, 38, 38, 0.1) !important;
    }

    .table-custom tr:last-child td {
      border-bottom: none;
    }
    
    .table-custom tbody tr:hover {
      background-color: var(--table-hover-bg);
    }

    /* 🏷️ 類型 Tag 專用字體顏色 */
    .badge-lend {
      background-color: var(--badge-lend-bg);
      color: var(--badge-lend-text) !important;
      font-weight: 700;
      padding: 0.35em 0.8em;
      border-radius: 6px;
      display: inline-block;
    }

    .badge-repay {
      background-color: var(--badge-repay-bg);
      color: var(--badge-repay-text) !important;
      font-weight: 700;
      padding: 0.35em 0.8em;
      border-radius: 6px;
      display: inline-block;
    }

    .amount-lend {
      color: var(--amount-lend-text) !important;
      font-weight: 700;
    }

    .amount-repay {
      color: var(--amount-repay-text) !important;
      font-weight: 700;
    }

    .swal2-container {
      padding: 0 !important;
    }

    .swal2-container .swal-fullscreen-popup {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vw !important;
      border-radius: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
    }

    i[data-lucide] {
      width: 1.25rem;
      height: 1.25rem;
      display: inline-block;
      vertical-align: -0.2em;
    }
    
    @media (min-width: 992px) {
      .history-container {
        max-height: 580px;
        overflow-y: auto;
        padding: 3px;
      }
    }
    
    @media (max-width: 991.98px) {
      .history-container {
        max-height: none !important;
        overflow-y: visible !important;
      }
    }
  </style>
</head>
<body>

  <div class="container flex-grow-1" style="max-width: 1000px;">
    
    <!-- 頂部列：公告與右上角操作區 (含同步儲存與登入/登出) -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="fw-bold fs-5 text-primary d-flex align-items-center gap-2">
        <i data-lucide="calculator"></i> <span id="appTitle">帳務管理系統</span>
      </div>
      
      <div class="d-flex align-items-center gap-2">
        <!-- 同步儲存按鈕 (已移至此處) -->
        <button class="btn btn-sm btn-success rounded-pill px-3 py-1.5 d-none align-items-center gap-1.5" onclick="batchSyncChanges()" id="saveChangesBtn">
          <i data-lucide="save" style="width: 1rem; height: 1rem;"></i> <span>儲存變更</span>
        </button>

        <!-- 右上角管理員登入/登出按鈕 -->
        <button class="btn btn-sm rounded-pill px-3 py-1.5 d-flex align-items-center gap-1.5" id="authBtn" onclick="handleAuthAction()">
          <i data-lucide="lock" style="width:1rem; height:1rem;"></i>
          <span>管理員登入</span>
        </button>
      </div>
    </div>

    <!-- 公告展示區 -->
    <div id="announcementContainer" class="d-flex flex-column gap-2 mb-3"></div>
    
    <!-- 📢 管理員公告編輯區 (登入後顯示) -->
    <div id="announcementEditorCard" class="card slate-card mb-4 d-none">
      <div class="card-header bg-transparent border-0 pt-3 px-4 pb-0 d-flex align-items-center justify-content-between">
        <h6 class="card-title fw-bold m-0 d-flex align-items-center gap-2 text-warning">
          <i data-lucide="megaphone"></i> 管理員公告設定
        </h6>
        <button class="btn btn-sm btn-outline-primary rounded-pill px-2.5 py-0.5" onclick="addAnnouncementRow()">
          <i data-lucide="plus" style="width:0.85rem; height:0.85rem;"></i> 新增公告
        </button>
      </div>
      <div class="card-body p-3">
        <div id="announcementEditList" class="d-flex flex-column gap-2"></div>
      </div>
    </div>

    <div class="row g-4">
      <!-- 左側：待還總金額 & 新增紀錄 -->
      <div class="col-12 col-lg-5">
        <div class="d-flex flex-column gap-3 sticky-lg-top" style="top: 1.5rem; z-index: 10;">
          <div class="card slate-card hero-card p-3">
            <div class="card-body">
              <div class="d-flex align-items-center gap-2 mb-2">
                <i data-lucide="wallet" class="text-primary"></i>
                <span class="text-sub">目前待還總金額</span>
              </div>
              <h2 class="display-6 fw-bold mb-0 hero-amount" id="totalOwed">NT$ --</h2>
            </div>
          </div>

          <div class="card slate-card">
            <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0">
              <h5 class="card-title fw-bold m-0 d-flex align-items-center gap-2">
                <i data-lucide="file-pen-line" class="text-primary"></i> 新增紀錄
              </h5>
            </div>
            <div class="card-body p-4">
              <form id="ledgerForm">
                <div class="row g-3">
                  <div class="col-6">
                    <label for="date" class="form-label small">日期</label>
                    <input type="date" class="form-control rounded-3" id="date" required>
                  </div>

                  <div class="col-6">
                    <label class="form-label small">類型</label>
                    <input type="hidden" id="type" value="借錢">
                    <div class="dropdown">
                      <button class="btn btn-custom-dropdown dropdown-toggle w-100 rounded-3 text-start d-flex align-items-center justify-content-between" type="button" id="typeDropdownBtn" data-bs-toggle="dropdown">
                        <span id="typeDropdownLabel"><i data-lucide="arrow-up-right" class="text-danger me-1"></i> 借錢</span>
                      </button>
                      <ul class="dropdown-menu dropdown-menu-end w-100 rounded-3">
                        <li>
                          <a class="dropdown-item py-2" href="#" onclick="selectType('借錢', '<i data-lucide=\'arrow-up-right\' class=\'text-danger me-1\'></i> 借錢'); return false;">
                            <i data-lucide="arrow-up-right" class="text-danger me-1"></i> 借錢
                          </a>
                        </li>
                        <li>
                          <a class="dropdown-item py-2" href="#" onclick="selectType('還錢', '<i data-lucide=\'arrow-down-left\' class=\'text-success me-1\'></i> 還錢'); return false;">
                            <i data-lucide="arrow-down-left" class="text-success me-1"></i> 還錢
                          </a>
                        </li>
                      </ul>
                    </div>
                  </div>

                  <div class="col-12">
                    <label for="amount" class="form-label small">金額 (NT$)</label>
                    <input type="number" class="form-control rounded-3" id="amount" min="1" required placeholder="例如：100">
                  </div>
                  <div class="col-12">
                    <label for="note" class="form-label small">備註說明</label>
                    <input type="text" class="form-control rounded-3" id="note" placeholder="例如：午餐、飲料、轉帳">
                  </div>
                  <div class="col-12 pt-2">
                    <button type="submit" class="btn btn-slate-primary w-100 py-2.5 rounded-3 d-flex align-items-center justify-content-center gap-2" id="submitBtn">
                      <i data-lucide="send"></i> 送出紀錄
                    </button>
                    <div id="submitAlert" class="alert alert-success mt-2 mb-0 py-2 px-3 text-center rounded-3 d-none fade" role="alert" style="font-size: 0.9rem;">
                      <i data-lucide="check-circle" class="me-1"></i> 已記錄！
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- 右側：歷史紀錄清單 -->
      <div class="col-12 col-lg-7">
        <div class="card slate-card">
          <div class="card-header bg-transparent border-0 pt-4 px-4 pb-0 d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
              <h5 class="card-title fw-bold m-0 d-flex align-items-center gap-2">
                <i data-lucide="history" class="text-primary"></i> 歷史紀錄
              </h5>
              <span class="badge bg-secondary-subtle text-secondary rounded-pill px-2.5 py-1 fw-normal small" id="recordCount">0 筆</span>
            </div>

            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-sm btn-custom-dropdown rounded-pill px-3 py-1 d-flex align-items-center gap-1.5" onclick="toggleSortOrder()" id="sortBtn">
                <i data-lucide="arrow-down-wide-narrow" class="text-primary"></i> <span>最新月在前</span>
              </button>
            </div>
          </div>

          <div class="card-body p-4">
            <div class="history-container">
              <div class="accordion" id="monthlyHistoryAccordion">
                <div class="text-center text-sub py-5">載入中...</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="mt-auto pt-5 pb-3 text-center small">
    <div class="container">
      <div class="dropdown d-inline-block mb-3">
        <button class="btn btn-sm btn-custom-dropdown dropdown-toggle rounded-pill px-3" type="button" id="themeDropdownBtn" data-bs-toggle="dropdown">
          <span id="themeDropdownLabel">主題設定</span>
        </button>
        <ul class="dropdown-menu shadow rounded-3">
          <li><a class="dropdown-item" href="#" onclick="changeTheme('light'); return false;"><i data-lucide="sun" class="text-warning me-2"></i>淺色模式</a></li>
          <li><a class="dropdown-item" href="#" onclick="changeTheme('dark'); return false;"><i data-lucide="moon" class="text-primary me-2"></i>深色模式</a></li>
          <li><hr class="dropdown-divider opacity-25"></li>
          <li><a class="dropdown-item" href="#" onclick="changeTheme('auto'); return false;"><i data-lucide="monitor" class="me-2"></i>隨系統切換</a></li>
        </ul>
      </div>
      <div class="text-sub opacity-75">Copyright © 2026 帳務管理系統v5.3 by Dinher</div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxP0BpEun_t9OWNh0J0SrybPkkkb83a4QiKdEN6UHjwLziHjdwcQhGYAu0e67DCDdJt5w/exec"; 
    
    let currentSheetName = null;
    let globalHistoryData = [];
    let globalAnnouncements = [];
    let currentTotalOwed = 0;
    let currentSortOrder = 'desc';

    let tableSortKey = 'date';
    let tableSortOrder = 'desc';
    
    // 🔐 管理員權限狀態
    let adminPassword = localStorage.getItem('admin_pwd') || null;
    let isLoggedIn = !!adminPassword;
    let pendingChanges = new Map();

    function getLocalDateString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    document.getElementById('date').value = getLocalDateString();

    function refreshIcons() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function initConfig() {
      const urlParams = new URLSearchParams(window.location.search);
      currentSheetName = urlParams.get('load');

      if (!currentSheetName) {
        throw new Error("網址缺少 `?load=工作表名稱` 參數。");
      }
    }

    // 🎨 主題切換
    const systemThemeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    systemThemeMedia.addEventListener('change', () => {
      if (localStorage.getItem('user-theme') === 'auto') {
        applyTheme('auto');
      }
    });

    function changeTheme(mode) {
      localStorage.setItem('user-theme', mode);
      applyTheme(mode);
    }

    function applyTheme(mode) {
      let targetTheme = mode;
      if (mode === 'auto') {
        targetTheme = systemThemeMedia.matches ? 'dark' : 'light';
      }

      document.documentElement.setAttribute('data-bs-theme', targetTheme);

      const labelMap = {
        light: '<i data-lucide="sun" class="text-warning me-1"></i> 淺色模式',
        dark: '<i data-lucide="moon" class="text-primary me-1"></i> 深色模式',
        auto: '<i data-lucide="monitor" class="me-1"></i> 隨系統切換'
      };
      document.getElementById('themeDropdownLabel').innerHTML = labelMap[mode] || labelMap.auto;
      refreshIcons();
    }

    applyTheme(localStorage.getItem('user-theme') || 'auto');

    // 🔐 登入/登出 UI 切換
    function updateAuthUI() {
      const authBtn = document.getElementById('authBtn');
      const saveBtn = document.getElementById('saveChangesBtn');
      const annCard = document.getElementById('announcementEditorCard');

      if (isLoggedIn) {
        authBtn.className = "btn btn-sm btn-outline-danger rounded-pill px-3 py-1.5 d-flex align-items-center gap-1.5";
        authBtn.innerHTML = `<i data-lucide="log-out" style="width:1rem; height:1rem;"></i> <span>登出管理員</span>`;
        
        saveBtn.classList.remove('d-none');
        saveBtn.classList.add('d-flex');

        annCard.classList.remove('d-none');
      } else {
        authBtn.className = "btn btn-sm btn-outline-primary rounded-pill px-3 py-1.5 d-flex align-items-center gap-1.5";
        authBtn.innerHTML = `<i data-lucide="lock" style="width:1rem; height:1rem;"></i> <span>管理員登入</span>`;
        
        saveBtn.classList.add('d-none');
        saveBtn.classList.remove('d-flex');

        annCard.classList.add('d-none');
      }
      
      refreshIcons();
      renderAnnouncements();
      renderAnnouncementEditor();
      renderHistoryList();
    }

    async function handleAuthAction() {
      if (isLoggedIn) {
        adminPassword = null;
        isLoggedIn = false;
        localStorage.removeItem('admin_pwd');
        pendingChanges.clear();
        updateAuthUI();
        
        const swalStyle = getSwalStyle();
        Swal.fire({
          icon: 'info',
          title: '已登出管理員',
          timer: 1200,
          showConfirmButton: false,
          background: swalStyle.background,
          color: swalStyle.color
        });
      } else {
        const pwd = await getPasswordAuthorization();
        if (pwd) {
          adminPassword = pwd;
          isLoggedIn = true;
          localStorage.setItem('admin_pwd', pwd);
          updateAuthUI();

          const swalStyle = getSwalStyle();
          Swal.fire({
            icon: 'success',
            title: '驗證成功',
            text: '已進入管理編輯模式',
            timer: 1200,
            showConfirmButton: false,
            background: swalStyle.background,
            color: swalStyle.color
          });
        }
      }
    }

    function toggleSortOrder() {
      currentSortOrder = (currentSortOrder === 'desc') ? 'asc' : 'desc';
      const sortBtn = document.getElementById('sortBtn');
      
      sortBtn.innerHTML = (currentSortOrder === 'desc') 
        ? `<i data-lucide="arrow-down-wide-narrow" class="text-primary"></i> <span>最新月在前</span>`
        : `<i data-lucide="arrow-up-narrow-wide" class="text-primary"></i> <span>最舊月在前</span>`;
        
      refreshIcons();
      renderHistoryList();
    }

    function handleTableSort(key) {
      if (tableSortKey === key) {
        tableSortOrder = (tableSortOrder === 'asc') ? 'desc' : 'asc';
      } else {
        tableSortKey = key;
        tableSortOrder = (key === 'amount') ? 'desc' : 'asc';
      }
      renderHistoryList();
    }

    function getSortIconHtml(key) {
      if (tableSortKey !== key) {
        return `<i data-lucide="arrow-up-down" class="opacity-25 ms-1" style="width:0.85rem; height:0.85rem;"></i>`;
      }
      return tableSortOrder === 'asc' 
        ? `<i data-lucide="arrow-up" class="text-primary ms-1" style="width:0.85rem; height:0.85rem;"></i>`
        : `<i data-lucide="arrow-down" class="text-primary ms-1" style="width:0.85rem; height:0.85rem;"></i>`;
    }

    function updateUIStats() {
      document.getElementById('totalOwed').innerText = `NT$ ${currentTotalOwed.toLocaleString()}`;
      document.getElementById('recordCount').innerText = `${globalHistoryData.length} 筆紀錄`;
    }

    async function batchSyncChanges() {
      if (!isLoggedIn) return;

      const swalStyle = getSwalStyle();
      const totalTasks = pendingChanges.size;

      if (totalTasks === 0) {
        Swal.fire({
          icon: 'info',
          title: '無歷史變更需要儲存',
          timer: 1200,
          showConfirmButton: false,
          background: swalStyle.background,
          color: swalStyle.color
        });
        return;
      }

      Swal.fire({
        title: '同步修訂資料中...',
        html: `正在寫入 <b>${totalTasks}</b> 筆異動，請稍候...`,
        background: swalStyle.background,
        color: swalStyle.color,
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        const sortedEntries = Array.from(pendingChanges.entries()).sort((a, b) => b[0] - a[0]);

        for (const [index, change] of sortedEntries) {
          let payload = {
            sheet: currentSheetName,
            password: adminPassword,
            index: index
          };

          if (change.action === 'delete') {
            payload.action = 'delete';
          } else {
            payload.action = 'edit';
            payload.record = {
              date: change.record.date,
              type: change.record.type,
              amount: Number(change.record.amount),
              note: change.record.note
            };
          }

          const res = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          const result = await res.json();

          if (result.status === 'error' && result.message === '密碼錯誤') {
            adminPassword = null;
            isLoggedIn = false;
            localStorage.removeItem('admin_pwd');
            updateAuthUI();
            throw new Error('管理密碼無效或已變更，請重新登入。');
          }

          if (result.status !== 'success') {
            throw new Error(`索引 #${index} 操作失敗`);
          }
        }

        pendingChanges.clear();
        await loadData(false);

        Swal.fire({
          icon: 'success',
          title: '已同步完成！',
          timer: 1500,
          showConfirmButton: false,
          background: swalStyle.background,
          color: swalStyle.color
        });

      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: '同步失敗',
          text: err.message,
          background: swalStyle.background,
          color: swalStyle.color
        });
      }
    }

    // 📢 渲染與編輯公告
    const alertIconMap = {
      info: 'info',
      warning: 'triangle-alert',
      danger: 'octagon-alert',
      success: 'check-circle'
    };

    function renderAnnouncements() {
      const container = document.getElementById('announcementContainer');
      
      if (!globalAnnouncements || globalAnnouncements.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = globalAnnouncements.map((item) => {
        const alertType = item.type || 'info';
        const iconName = alertIconMap[alertType] || 'megaphone';

        return `
          <div class="alert alert-${alertType} alert-dismissible fade show m-0 rounded-3 d-flex align-items-center gap-2 border-0 shadow-sm" role="alert">
            <i data-lucide="${iconName}" class="flex-shrink-0"></i>
            <div class="flex-grow-1 fw-medium">${item.content}</div>
          </div>
        `;
      }).join('');

      refreshIcons();
    }

    // ✏️ 渲染公告編輯器 (管理員專用)
    function renderAnnouncementEditor() {
      if (!isLoggedIn) return;

      const editList = document.getElementById('announcementEditList');
      if (!globalAnnouncements || globalAnnouncements.length === 0) {
        editList.innerHTML = `<div class="text-sub small text-center py-2">目前尚無公告，可點選上方「新增公告」</div>`;
        return;
      }

      editList.innerHTML = globalAnnouncements.map((item, idx) => `
        <div class="d-flex align-items-center gap-2">
          <input type="text" class="form-control form-control-sm rounded-2 flex-grow-1" 
                 value="${item.content || ''}" 
                 placeholder="公告內容" 
                 onchange="updateAnnouncementItem(${idx}, 'content', this.value)">
                 
          <select class="form-select form-select-sm rounded-2" style="width: 100px;" 
                  onchange="updateAnnouncementItem(${idx}, 'type', this.value)">
            <option value="info" ${item.type === 'info' ? 'selected' : ''}>提示 (藍)</option>
            <option value="warning" ${item.type === 'warning' ? 'selected' : ''}>警告 (黃)</option>
            <option value="danger" ${item.type === 'danger' ? 'selected' : ''}>緊急 (紅)</option>
            <option value="success" ${item.type === 'success' ? 'selected' : ''}>成功 (綠)</option>
          </select>

          <button class="btn btn-sm btn-link text-danger p-0 ms-1" onclick="deleteAnnouncementItem(${idx})" title="刪除公告">
            <i data-lucide="trash-2" style="width:1rem;height:1rem;"></i>
          </button>
        </div>
      `).join('');

      refreshIcons();
    }

    function updateAnnouncementItem(index, field, value) {
      if (globalAnnouncements[index]) {
        globalAnnouncements[index][field] = value;
        renderAnnouncements();
      }
    }

    function addAnnouncementRow() {
      globalAnnouncements.push({ content: "新公告內容", type: "info" });
      renderAnnouncements();
      renderAnnouncementEditor();
    }

    function deleteAnnouncementItem(index) {
      globalAnnouncements.splice(index, 1);
      renderAnnouncements();
      renderAnnouncementEditor();
    }

    // 📜 渲染歷史紀錄清單
    function renderHistoryList() {
      const accordionContainer = document.getElementById('monthlyHistoryAccordion');

      const openCollapseIds = new Set();
      document.querySelectorAll('#monthlyHistoryAccordion .accordion-collapse.show').forEach(el => {
        openCollapseIds.add(el.id);
      });

      if (!globalHistoryData || globalHistoryData.length === 0) {
        accordionContainer.innerHTML = `<div class="text-center text-sub py-5">目前尚無任何借還記錄</div>`;
        return;
      }

      const groups = {};
      globalHistoryData.forEach((item, index) => {
        item._originalIndex = index;
        const monthKey = item.date ? item.date.substring(0, 7) : '未知月份';
        if (!groups[monthKey]) {
          groups[monthKey] = [];
        }
        groups[monthKey].push(item);
      });

      const sortedMonthKeys = Object.keys(groups).sort((a, b) => {
        return currentSortOrder === 'desc' ? b.localeCompare(a) : a.localeCompare(b);
      });

      accordionContainer.innerHTML = sortedMonthKeys.map((monthKey, index) => {
        const monthItems = groups[monthKey];

        monthItems.sort((a, b) => {
          let valA = a[tableSortKey];
          let valB = b[tableSortKey];

          if (tableSortKey === 'amount') {
            valA = Number(valA) || 0;
            valB = Number(valB) || 0;
          } else {
            valA = String(valA || '');
            valB = String(valB || '');
          }

          if (valA < valB) return tableSortOrder === 'asc' ? -1 : 1;
          if (valA > valB) return tableSortOrder === 'asc' ? 1 : -1;
          return 0;
        });

        let monthBorrowTotal = 0;
        let monthRepayTotal = 0;

        monthItems.forEach(item => {
          const amt = Number(item.amount) || 0;
          if (item.type === '借錢') monthBorrowTotal += amt;
          if (item.type === '還錢') monthRepayTotal += amt;
        });

        const netChange = monthBorrowTotal - monthRepayTotal;
        const collapseId = `collapse-${monthKey.replace('-', '')}`;
        const headingId = `heading-${monthKey.replace('-', '')}`;

        const isShow = openCollapseIds.size > 0 
          ? openCollapseIds.has(collapseId) 
          : (index === 0);

        const [year, month] = monthKey.split('-');
        const formattedMonthLabel = year && month ? `${year} 年 ${month} 月` : monthKey;

        const tableRows = monthItems.map(item => {
          const origIdx = item._originalIndex;
          const isBorrow = item.type === '借錢';
          const amt = Number(item.amount) || 0;
          const formattedAmt = `${isBorrow ? '+' : '-'} NT$ ${amt.toLocaleString()}`;
          const isPendingDeleted = pendingChanges.get(origIdx)?.action === 'delete';

          // ✏️ 登入後：顯示無黑框、透明感的編輯欄位
          if (isLoggedIn) {
            return `
              <tr class="${isPendingDeleted ? 'pending-deleted' : ''}">
                <td style="width: 135px;" class="text-center">
                  <input type="date" class="form-control edit-input-clean text-center" 
                         value="${item.date}" 
                         onchange="handleInputChange(${origIdx}, 'date', this.value)" 
                         ${isPendingDeleted ? 'disabled' : ''}>
                </td>
                <td style="width: 110px;" class="text-center">
                  <select class="form-select edit-input-clean text-center fw-bold ${isBorrow ? 'text-danger' : 'text-success'}" 
                          onchange="handleInputChange(${origIdx}, 'type', this.value)"
                          ${isPendingDeleted ? 'disabled' : ''}>
                    <option value="借錢" class="text-danger fw-bold" ${item.type === '借錢' ? 'selected' : ''}>借錢</option>
                    <option value="還錢" class="text-success fw-bold" ${item.type === '還錢' ? 'selected' : ''}>還錢</option>
                  </select>
                </td>
                <td style="width: 135px;" class="text-center">
                  <input type="number" class="form-control edit-input-clean text-center fw-bold ${isBorrow ? 'text-danger' : 'text-success'}" 
                         value="${amt}" min="1" 
                         onchange="handleInputChange(${origIdx}, 'amount', this.value)" 
                         ${isPendingDeleted ? 'disabled' : ''}>
                </td>
                <td class="text-start">
                  <input type="text" class="form-control edit-input-clean edit-note-input" 
                         value="${item.note || ''}" placeholder="備註說明" 
                         onchange="handleInputChange(${origIdx}, 'note', this.value)" 
                         ${isPendingDeleted ? 'disabled' : ''}>
                </td>
                <td class="text-center" style="min-width: 70px;">
                  <button class="btn btn-sm btn-link ${isPendingDeleted ? 'text-secondary' : 'text-danger'} p-0" 
                          title="${isPendingDeleted ? '復原刪除' : '標記刪除'}" 
                          onclick="togglePendingDelete(${origIdx})">
                    <i data-lucide="${isPendingDeleted ? 'rotate-ccw' : 'trash-2'}" style="width:1rem;height:1rem;"></i>
                  </button>
                </td>
              </tr>
            `;
          }

          // 👁️ 未登入：一般檢視
          return `
            <tr>
              <td class="text-nowrap text-sub text-center" style="width: 25%; font-size:0.9rem;">${item.date}</td>
              <td class="text-nowrap text-center" style="width: 20%;">
                <span class="${isBorrow ? 'badge-lend' : 'badge-repay'} fs-7">
                  ${item.type}
                </span>
              </td>
              <td class="${isBorrow ? 'amount-lend' : 'amount-repay'} text-nowrap text-center" style="width: 25%;">
                ${formattedAmt}
              </td>
              <td class="text-sub text-nowrap text-start" style="width: 30%; font-size:0.9rem;">${item.note || ''}</td>
            </tr>
          `;
        }).join('');

        return `
          <div class="accordion-item">
            <h2 class="accordion-header" id="${headingId}">
              <button class="accordion-button ${isShow ? '' : 'collapsed'} d-flex align-items-center justify-content-between pe-4" 
                      type="button" 
                      data-bs-toggle="collapse" 
                      data-bs-target="#${collapseId}" 
                      aria-expanded="${isShow ? 'true' : 'false'}" 
                      aria-controls="${collapseId}">
                <div class="d-flex align-items-center gap-2 flex-grow-1 me-2">
                  <i data-lucide="calendar" class="text-primary"></i>
                  <span class="fw-bold">${formattedMonthLabel}</span>
                  <span class="badge bg-secondary-subtle text-secondary rounded-pill small ms-1">${monthItems.length} 筆</span>
                </div>
                
                <div class="text-end me-2" style="font-size:0.9rem;">
                  <span class="text-sub d-none d-sm-inline">當月淨變動：</span>
                  <span class="fw-bold ${netChange > 0 ? 'amount-lend' : (netChange < 0 ? 'amount-repay' : 'text-sub')}">
                    ${netChange > 0 ? '+' : ''}${netChange.toLocaleString()}
                  </span>
                </div>
              </button>
            </h2>
            <div id="${collapseId}" 
                 class="accordion-collapse collapse ${isShow ? 'show' : ''}" 
                 aria-labelledby="${headingId}">
              <div class="accordion-body">
                <div class="table-responsive">
                  <table class="table table-custom align-middle">
                    <thead>
                      <tr>
                        <th class="sortable text-nowrap text-center ${tableSortKey === 'date' ? 'active' : ''}" style="min-width: 125px;" onclick="handleTableSort('date')">
                          日期 ${getSortIconHtml('date')}
                        </th>
                        <th class="sortable text-nowrap text-center ${tableSortKey === 'type' ? 'active' : ''}" style="min-width: 100px;" onclick="handleTableSort('type')">
                          類型 ${getSortIconHtml('type')}
                        </th>
                        <th class="sortable text-nowrap text-center ${tableSortKey === 'amount' ? 'active' : ''}" style="min-width: 125px;" onclick="handleTableSort('amount')">
                          金額 ${getSortIconHtml('amount')}
                        </th>
                        <th class="text-sub text-nowrap text-start">備註</th>
                        ${isLoggedIn ? '<th style="width: 40px;" class="text-center">操作</th>' : ''}
                      </tr>
                    </thead>
                    <tbody>
                      ${tableRows}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      refreshIcons();
    }

    function handleInputChange(index, field, value) {
      if (!isLoggedIn) return;

      const record = globalHistoryData[index];
      if (!record) return;

      let val = value;
      if (field === 'amount') val = Number(value) || 0;

      record[field] = val;

      const currentPending = pendingChanges.get(index) || { action: 'edit', record: { ...record } };
      if (currentPending.action === 'edit') {
        currentPending.record[field] = val;
        pendingChanges.set(index, currentPending);
      }
    }

    function togglePendingDelete(index) {
      const currentPending = pendingChanges.get(index);

      if (currentPending && currentPending.action === 'delete') {
        pendingChanges.delete(index);
      } else {
        pendingChanges.set(index, { action: 'delete' });
      }
      renderHistoryList();
    }

    function selectType(value, labelHtml) {
      document.getElementById('type').value = value;
      document.getElementById('typeDropdownLabel').innerHTML = labelHtml;
      refreshIcons();
    }

    function getSwalStyle() {
      const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
      return {
        background: isDark ? '#121212' : '#ffffff',
        color: isDark ? '#f1f5f9' : '#0f172a'
      };
    }

    async function getPasswordAuthorization() {
      const swalStyle = getSwalStyle();
      const { value: password } = await Swal.fire({
        title: '管理員驗證',
        input: 'password',
        inputLabel: '請輸入管理員密碼',
        inputPlaceholder: '請輸入密碼',
        showCancelButton: true,
        cancelButtonText: '取消',
        confirmButtonText: '登入',
        confirmButtonColor: '#2563eb',
        background: swalStyle.background,
        color: swalStyle.color
      });

      return password || null;
    }

    async function loadData(showLoading = true) {
      const swalStyle = getSwalStyle();

      if (showLoading) {
        Swal.fire({
          title: '資料同步中...',
          background: swalStyle.background,
          color: swalStyle.color,
          allowOutsideClick: false,
          heightAuto: false,
          customClass: { popup: 'swal-fullscreen-popup' },
          didOpen: () => Swal.showLoading()
        });
      }

      try {
        const fetchUrl = `${API_URL}?sheet=${encodeURIComponent(currentSheetName)}`;
        const res = await fetch(fetchUrl);
        const data = await res.json();

        if (data.status === 'error') {
          throw new Error(data.message || '讀取失敗');
        }

        if (data.title) {
          document.title = data.title;
          document.getElementById('appTitle').innerText = data.title;
        }

        currentTotalOwed = data.totalOwed || 0;
        globalHistoryData = data.history || [];
        globalAnnouncements = data.announcements || [];

        updateUIStats();
        updateAuthUI();

        if (showLoading) Swal.close();
      } catch (err) {
        if (showLoading) {
          Swal.fire({
            icon: 'error',
            title: '連線失敗',
            text: err.message || '無法讀取後端資料庫。',
            background: swalStyle.background,
            color: swalStyle.color,
            allowOutsideClick: false,
            showConfirmButton: true,
            confirmButtonText: '重新整理',
            confirmButtonColor: '#2563eb',
            heightAuto: false,
            customClass: { popup: 'swal-fullscreen-popup' }
          }).then((result) => {
            if (result.isConfirmed) {
              window.location.reload();
            }
          });
        }
        document.getElementById('monthlyHistoryAccordion').innerHTML = `<div class="text-center text-danger py-5">資料載入失敗</div>`;
      }
    }

    document.getElementById('ledgerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const alertEl = document.getElementById('submitAlert');
      const amountVal = Number(document.getElementById('amount').value);
      const typeVal = document.getElementById('type').value;
      const dateVal = document.getElementById('date').value;
      const noteVal = document.getElementById('note').value;

      if (!amountVal || amountVal <= 0) return;

      alertEl.classList.add('d-none');
      alertEl.classList.remove('show');

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> 處理中...`;

      const newRecord = {
        sheet: currentSheetName,
        action: 'add',
        date: dateVal,
        type: typeVal,
        amount: amountVal,
        note: noteVal
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(newRecord)
        });
        const result = await res.json();

        if (result.status !== 'success') {
          throw new Error('寫入失敗');
        }

        await loadData(false);

        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';

        alertEl.classList.remove('show');
        alertEl.classList.remove('d-none');
        setTimeout(() => alertEl.classList.add('show'), 10);
        refreshIcons();

        setTimeout(() => {
          alertEl.classList.remove('show');
          setTimeout(() => alertEl.classList.add('d-none'), 150);
        }, 2000);

      } catch (err) {
        const swalStyle = getSwalStyle();
        Swal.fire({
          icon: 'error',
          title: '寫入失敗',
          text: '紀錄未成功寫入資料庫，請檢查網路連線。',
          background: swalStyle.background,
          color: swalStyle.color
        });
        await loadData(false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="send"></i> 送出紀錄`;
        refreshIcons();
      }
    });

    async function startApp() {
      const swalStyle = getSwalStyle();

      try {
        initConfig();
        await loadData(true);
      } catch (err) {
        console.error("應用程式初始化失敗:", err.message);

        Swal.fire({
          icon: 'error',
          title: '系統載入失敗',
          text: err.message,
          background: swalStyle.background,
          color: swalStyle.color,
          allowOutsideClick: false,
          showConfirmButton: true,
          confirmButtonText: '重新整理',
          confirmButtonColor: '#2563eb',
          heightAuto: false,
          customClass: { popup: 'swal-fullscreen-popup' }
        }).then((result) => {
          if (result.isConfirmed) {
            window.location.reload();
          }
        });

        document.getElementById('monthlyHistoryAccordion').innerHTML = `
          <div class="text-center text-danger py-5 fw-bold">
            <i data-lucide="circle-alert" style="width: 2.5rem; height: 2.5rem;" class="d-block mx-auto mb-2"></i>
            ${err.message}
          </div>`;
        refreshIcons();
      }
    }

    startApp();
  </script>
</body>
</html>
